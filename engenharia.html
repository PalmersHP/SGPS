<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sombrear — Controle de Obras</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<style>
:root{
  --verde:#8DC63F;--verde-d:#6FAE2E;
  --sb:#0d1117;--sb-border:rgba(255,255,255,.06);
  --bg:#f5f6fa;--card:#fff;--border:#e8eaed;
  --text:#111827;--text-2:#6b7280;--text-3:#9ca3af;
  --radius:12px;--shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 20px rgba(0,0,0,.09);--sb-width:220px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--text);}

/* ══ LOGIN ══ */
#loginScreen{min-height:100vh;background:linear-gradient(145deg,#0a0e17 0%,#111827 60%,#0a0e17 100%);display:flex;align-items:center;justify-content:center;}
.login-box{width:100%;max-width:440px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:44px 40px;}
.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:32px;}
.login-brand-icon{width:44px;height:44px;background:var(--verde);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;}
.login-brand-name{font-size:18px;font-weight:700;color:#fff;}
.login-brand-sub{font-size:11px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:2px;}
.login-title{font-size:26px;font-weight:700;color:#fff;margin-bottom:6px;}
.login-sub{font-size:13px;color:rgba(255,255,255,.5);margin-bottom:32px;}
.lf{margin-bottom:18px;}
.lf label{display:block;font-size:11px;font-weight:600;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
.lf input{width:100%;padding:13px 16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;font-family:'Poppins',sans-serif;font-size:14px;color:#fff;outline:none;transition:border-color .2s;}
.lf input:focus{border-color:var(--verde);}
.login-btn{width:100%;padding:14px;background:var(--verde);color:#fff;border:none;border-radius:10px;font-family:'Poppins',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:background .2s;margin-top:6px;}
.login-btn:hover{background:var(--verde-d);}
.login-btn:disabled{opacity:.6;cursor:not-allowed;}
.login-err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:10px 14px;font-size:12px;color:#fca5a5;margin-top:14px;display:none;}

/* ══ APP ══ */
#appShell{display:none;height:100vh;overflow:hidden;}
.app-layout{display:flex;height:100vh;}

/* ── SIDEBAR ── */
#sidebar{width:var(--sb-width);background:var(--sb);display:flex;flex-direction:column;flex-shrink:0;border-right:1px solid var(--sb-border);}
.sb-top{padding:20px 16px 16px;border-bottom:1px solid var(--sb-border);}
.sb-brand{display:flex;align-items:center;gap:10px;}
.sb-brand-icon{width:36px;height:36px;background:var(--verde);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.sb-brand-name{font-size:14px;font-weight:700;color:#fff;}
.sb-brand-sub{font-size:10px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:1.5px;}
.sb-nav{flex:1;padding:12px 8px;overflow-y:auto;}
.sb-section{font-size:10px;font-weight:700;color:rgba(255,255,255,.25);text-transform:uppercase;letter-spacing:1.5px;padding:8px 10px 4px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;cursor:pointer;font-size:13px;color:rgba(255,255,255,.55);transition:all .15s;margin-bottom:2px;}
.nav-item:hover{background:rgba(255,255,255,.05);color:rgba(255,255,255,.85);}
.nav-item.active{background:rgba(141,198,63,.15);color:var(--verde);}
.ni-icon{font-size:16px;width:20px;text-align:center;flex-shrink:0;}
.sb-bottom{padding:12px 8px;border-top:1px solid var(--sb-border);}
.sb-user{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:9px;cursor:pointer;transition:background .15s;}
.sb-user:hover{background:rgba(255,255,255,.05);}
.sb-av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--verde),var(--verde-d));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0;}
.sb-nome{font-size:12px;font-weight:600;color:rgba(255,255,255,.8);}
.sb-role{font-size:10px;color:rgba(255,255,255,.35);}

/* ── TOPBAR ── */
.app-main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
#topbar{height:56px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:16px;flex-shrink:0;}
.tb-title{font-size:15px;font-weight:700;color:var(--text);flex:1;}
.tb-badge{background:rgba(141,198,63,.12);color:#5a8f1a;font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;border:1px solid rgba(141,198,63,.25);}
.tb-btn{padding:8px 16px;border-radius:8px;font-family:'Poppins',sans-serif;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:all .15s;}
.tb-btn-primary{background:var(--verde);color:#fff;}
.tb-btn-primary:hover{background:var(--verde-d);}

/* ── VIEWS ── */
.view{display:none;flex:1;overflow:hidden;flex-direction:column;}
.view.active{display:flex;}

/* ── DASHBOARD ── */
.dash-content{flex:1;overflow-y:auto;padding:24px;}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px;}
.kpi{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);border-left:4px solid var(--verde);}
.kpi-val{font-size:28px;font-weight:700;color:var(--text);}
.kpi-label{font-size:12px;color:var(--text-2);margin-top:4px;}
.kpi-sub{font-size:11px;color:var(--text-3);margin-top:2px;}
.kpi.azul{border-left-color:#3b82f6;}
.kpi.amarelo{border-left-color:#f59e0b;}
.kpi.vermelho{border-left-color:#ef4444;}
.funil-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px;}
.card-blk{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);}
.card-blk-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:16px;}
.funil-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);}
.funil-item:last-child{border-bottom:none;}
.funil-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.funil-col-name{flex:1;font-size:12px;color:var(--text-2);}
.funil-count{font-size:13px;font-weight:700;color:var(--text);min-width:24px;text-align:right;}
.pend-item{padding:10px 0;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:10px;}
.pend-item:last-child{border-bottom:none;}
.pend-obra{font-size:12px;font-weight:600;color:var(--text);}
.pend-etapa{font-size:11px;color:var(--text-2);}
.pend-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;flex-shrink:0;}
.pend-badge.atrasada{background:#fee2e2;color:#dc2626;}
.pend-badge.pendente{background:#fef9c3;color:#854d0e;}

/* ── KANBAN ── */
.kanban-wrap{flex:1;overflow-x:auto;padding:16px 24px;display:flex;gap:14px;align-items:flex-start;}
.kanban-col{min-width:270px;max-width:270px;background:rgba(0,0,0,.04);border-radius:var(--radius);display:flex;flex-direction:column;max-height:calc(100vh - 100px);}
.col-header{padding:12px 14px 10px;display:flex;align-items:center;gap:8px;flex-shrink:0;}
.col-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.col-name{font-size:12px;font-weight:700;color:var(--text);flex:1;}
.col-count{font-size:11px;font-weight:600;color:var(--text-3);background:rgba(0,0,0,.06);border-radius:10px;padding:1px 7px;}
.col-cards{flex:1;overflow-y:auto;padding:0 8px 8px;min-height:80px;}
.obra-card{background:var(--card);border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow);border:1px solid var(--border);transition:box-shadow .15s,transform .1s;}
.obra-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
.obra-card.sortable-ghost{opacity:.35;}
.obra-card.sortable-drag{box-shadow:0 8px 30px rgba(0,0,0,.2);}
.card-nome{font-size:12px;font-weight:700;color:var(--text);margin-bottom:2px;}
.card-cliente{font-size:11px;color:var(--text-2);margin-bottom:5px;}
.card-phase{font-size:10px;color:var(--text-3);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-meta{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px;}
.card-tag{font-size:10px;font-weight:600;padding:2px 7px;border-radius:6px;background:rgba(141,198,63,.1);color:#5a8f1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px;}
.card-tag.warn{background:rgba(239,68,68,.1);color:#dc2626;}
.card-tag.extras{background:rgba(59,130,246,.1);color:#1d4ed8;}
.timeline-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;display:inline-block;}
.tl-adiantada{background:#dcfce7;color:#166534;}
.tl-prazo{background:#fff7ed;color:#c2410c;}
.tl-atrasada{background:#fee2e2;color:#dc2626;}
.card-progress{height:3px;background:#e5e7eb;border-radius:2px;overflow:hidden;}
.card-progress-bar{height:100%;background:var(--verde);border-radius:2px;transition:width .3s;}
.card-footer{display:flex;justify-content:space-between;align-items:center;margin-top:7px;}
.card-data{font-size:10px;color:var(--text-3);}
.card-vagas{font-size:10px;font-weight:600;color:var(--text-2);}
.col-add{margin:0 8px 8px;padding:9px;border:1.5px dashed rgba(0,0,0,.12);border-radius:8px;text-align:center;font-size:11px;color:var(--text-3);cursor:pointer;transition:all .15s;flex-shrink:0;}
.col-add:hover{border-color:var(--verde);color:var(--verde);}

/* ── CONFIGURAÇÕES ── */
.config-content{flex:1;overflow-y:auto;padding:24px;max-width:860px;}
.config-tipo-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);}
.config-tipo-nome{font-size:14px;font-weight:700;color:var(--text);}
.config-tipo-sub{font-size:11px;color:var(--text-3);margin-top:2px;}
.etapa-edit-row{display:grid;grid-template-columns:1fr 130px 130px auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);}
.etapa-edit-row:last-child{border-bottom:none;}
.etapa-edit-inp{padding:7px 10px;border:1.5px solid var(--border);border-radius:8px;font-family:'Poppins',sans-serif;font-size:12px;color:var(--text);outline:none;transition:border-color .2s;background:#fff;width:100%;}
.etapa-edit-inp:focus{border-color:var(--verde);}
.etapa-edit-sel{padding:7px 8px;border:1.5px solid var(--border);border-radius:8px;font-family:'Poppins',sans-serif;font-size:11px;color:var(--text);outline:none;background:#fff;width:100%;}
.obrig-toggle{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-2);white-space:nowrap;}
.obrig-toggle input[type=checkbox]{accent-color:#ef4444;width:14px;height:14px;}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.open{display:flex;}
.modal{background:var(--card);border-radius:18px;width:100%;max-width:780px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.modal-hdr{padding:20px 24px 0;display:flex;align-items:flex-start;gap:12px;flex-shrink:0;}
.modal-hdr-info{flex:1;}
.modal-hdr-title{font-size:18px;font-weight:700;color:var(--text);}
.modal-hdr-sub{font-size:12px;color:var(--text-2);margin-top:2px;}
.modal-close{width:32px;height:32px;border:none;background:var(--bg);border-radius:8px;cursor:pointer;font-size:16px;color:var(--text-2);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.modal-tabs{display:flex;gap:0;padding:0 24px;border-bottom:1px solid var(--border);flex-shrink:0;margin-top:16px;overflow-x:auto;}
.modal-tab{padding:10px 16px;font-size:12px;font-weight:600;color:var(--text-2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;}
.modal-tab.active{color:var(--verde);border-bottom-color:var(--verde);}
.modal-body{flex:1;overflow-y:auto;padding:20px 24px;}
.modal-footer{padding:14px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;flex-shrink:0;align-items:center;}

/* ── FORM ── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.fg{display:flex;flex-direction:column;gap:6px;min-width:0;}
.fg.full{grid-column:1/-1;}
.fg label{font-size:11px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.5px;}
.fg input,.fg select,.fg textarea{width:100%;min-width:0;box-sizing:border-box;padding:10px 12px;border:1.5px solid var(--border);border-radius:9px;font-family:'Poppins',sans-serif;font-size:13px;color:var(--text);outline:none;transition:border-color .2s;background:#fff;}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--verde);}
.fg textarea{resize:vertical;min-height:80px;}

/* ── BONUS CHIPS ── */
.bonus-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;align-items:flex-start;}
.bonus-chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1.5px solid var(--border);border-radius:20px;cursor:pointer;font-size:12px;font-weight:400;color:var(--text-2);transition:all .15s;user-select:none;text-transform:none;letter-spacing:0;white-space:nowrap;width:fit-content;}
.bonus-chip:hover{border-color:var(--verde);}
.bonus-chip.selected{border-color:#3b82f6;background:rgba(59,130,246,.08);color:#1d4ed8;}
.bonus-chip input[type=checkbox]{accent-color:#3b82f6;flex-shrink:0;}

/* ── EXTRAS ── */
.extra-item{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.extra-inp{flex:1;padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-family:'Poppins',sans-serif;font-size:12px;color:var(--text);outline:none;transition:border-color .2s;}
.extra-inp:focus{border-color:var(--verde);}

/* ── CHECKLIST ── */
.etapa-group{margin-bottom:20px;}
.etapa-group-title{font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.etapa-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;border:1px solid var(--border);margin-bottom:6px;transition:background .15s;cursor:pointer;}
.etapa-item:hover{background:var(--bg);}
.etapa-item.done{background:#f0fdf4;border-color:#bbf7d0;}
.etapa-cb{width:18px;height:18px;border-radius:5px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;}
.etapa-item.done .etapa-cb{background:var(--verde);border-color:var(--verde);}
.etapa-cb::after{content:'✓';font-size:11px;font-weight:700;color:#fff;display:none;}
.etapa-item.done .etapa-cb::after{display:block;}
.etapa-label{flex:1;font-size:13px;color:var(--text);}
.etapa-item.done .etapa-label{text-decoration:line-through;color:var(--text-3);}
.etapa-data{font-size:10px;color:var(--text-3);}
.etapa-obrig{font-size:9px;font-weight:700;color:#dc2626;background:#fee2e2;padding:1px 6px;border-radius:8px;flex-shrink:0;}

/* ── DIÁRIO ── */
.diario-entry{background:var(--bg);border-radius:10px;padding:14px;margin-bottom:12px;border:1px solid var(--border);}
.diario-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.diario-data{font-size:12px;font-weight:700;color:var(--text);}
.diario-clima{font-size:11px;color:var(--text-2);}
.diario-ativ{font-size:13px;color:var(--text);margin-bottom:6px;}
.diario-pend{font-size:12px;color:#dc2626;}

/* ── QUANTITATIVOS ── */
.quant-inputs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.quant-result{background:var(--bg);border-radius:10px;padding:16px;}
.quant-section{font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:1px;margin:0 0 10px;}
.quant-line{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px;}
.quant-line:last-child{border-bottom:none;}
.quant-label{color:var(--text-2);}
.quant-val{font-weight:700;color:var(--text);}
.quant-divider{height:1px;background:var(--border);margin:14px 0;}

/* ── HISTÓRICO ── */
.hist-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
.hist-item:last-child{border-bottom:none;}
.hist-dot{width:8px;height:8px;border-radius:50%;background:var(--verde);flex-shrink:0;margin-top:5px;}
.hist-txt{font-size:12px;color:var(--text);flex:1;}
.hist-data{font-size:11px;color:var(--text-3);}

/* ── BUTTONS ── */
.btn{padding:9px 18px;border-radius:8px;font-family:'Poppins',sans-serif;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s;}
.btn-primary{background:var(--verde);color:#fff;}
.btn-primary:hover{background:var(--verde-d);}
.btn-ghost{background:var(--bg);color:var(--text-2);border:1px solid var(--border);}
.btn-ghost:hover{background:var(--border);}
.btn-danger{background:#fef2f2;color:#dc2626;border:1px solid #fca5a5;}
.btn-sm{padding:6px 12px;font-size:11px;}

/* ── BADGES ── */
.badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;display:inline-block;}
.bg-green{background:#dcfce7;color:#166534;}
.bg-gray{background:#f1f5f9;color:#475569;}
.bg-blue{background:#dbeafe;color:#1d4ed8;}
.bg-orange{background:#fff7ed;color:#c2410c;}

/* ── PREVIEW ETAPAS ── */
.preview-etapas{background:var(--bg);border-radius:10px;padding:14px;margin-top:8px;}
.preview-etapa-row{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12px;color:var(--text-2);border-bottom:1px solid var(--border);}
.preview-etapa-row:last-child{border-bottom:none;}
.preview-dot{width:6px;height:6px;border-radius:50%;background:var(--verde);flex-shrink:0;}
.preview-dot.obrig{background:#ef4444;}

/* ── TOAST ── */
#toast{position:fixed;bottom:24px;right:24px;background:#1f2937;color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:500;opacity:0;transform:translateY(8px);transition:all .3s;pointer-events:none;z-index:9999;max-width:320px;}
#toast.show{opacity:1;transform:translateY(0);}
#toast.success{background:#166534;}
#toast.error{background:#991b1b;}
.empty{padding:32px;text-align:center;color:var(--text-3);font-size:13px;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:4px;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-brand">
      <div class="login-brand-icon">🏗️</div>
      <div>
        <div class="login-brand-name">Sombrear</div>
        <div class="login-brand-sub">Engenharia</div>
      </div>
    </div>
    <div class="login-title">Controle de Obras</div>
    <div class="login-sub">Acesse com sua conta do Ecosistema Sombrear</div>
    <div class="lf"><label>E-mail</label><input type="email" id="loginEmail" placeholder="seu@email.com"></div>
    <div class="lf"><label>Senha</label><input type="password" id="loginSenha" placeholder="••••••••"></div>
    <button class="login-btn" id="loginBtn" onclick="doLogin()">Entrar</button>
    <div class="login-err" id="loginErr"></div>

];

// Etapas fixas compartilhadas por todos os tipos (Contrato + Financiamento)
// Não contam no % de progresso operacional
var ETAPAS_FIXAS = [
  {id:'ef1',label:'Em fase de contrato',              grupo:'Contrato',     coluna:'contrato', obrigatorio:true},
  {id:'ef2',label:'Em fase de plantão',               grupo:'Contrato',     coluna:'contrato', obrigatorio:false},
  {id:'ef3',label:'Docs finais de financiamento',     grupo:'Financiamento',coluna:'plantao',  obrigatorio:false},
  {id:'ef4',label:'Fase de desembolso',               grupo:'Financiamento',coluna:'plantao',  obrigatorio:false},
  {id:'ef5',label:'Docs análise de financiamento',    grupo:'Financiamento',coluna:'plantao',  obrigatorio:false},
  {id:'ef6',label:'Fechamento do aditivo',            grupo:'Financiamento',coluna:'plantao',  obrigatorio:false},
  {id:'ef7',label:'Contrato da financeira',           grupo:'Financiamento',coluna:'plantao',  obrigatorio:false},
  {id:'ef8',label:'Finalização da etapa de contrato', grupo:'Financiamento',coluna:'plantao',  obrigatorio:true},
];

var GRUPOS_NAO_OP = ['Contrato','Financiamento'];

// Produtos bonus: vão automaticamente para Serviços Extras
var PRODUTOS_BONUS = ['Sombrite Piscina','Sombrite Bicicletário','Sombrite Parquinho','Manutenção'];

var COLUNAS_OP = ['fabricacao','canteiro','fundacoes','instalacao','retoques','entrega'];
var GRUPOS_OP  = ['Fabricação','Execução','Finalização'];

// ════════════════════════════════════════════
// HELPERS DE ETAPAS
// ════════════════════════════════════════════
function getAllEtapasObra(o){
  var tipoEts = (o&&o.tipo_cobertura_id) ? (ENG.tipoEtapasMap[o.tipo_cobertura_id]||[]) : [];
  return ETAPAS_FIXAS.concat(tipoEts);
}

function calcProgresso(obraId){
  var map = ENG.etapasMap[obraId]||{};
  var o   = ENG.obras.find(function(x){return x.id===obraId;})||{};
  var extras   = o.itens_extras||[];
  var allEts   = getAllEtapasObra(o);
  var opEts    = allEts.filter(function(e){return GRUPOS_NAO_OP.indexOf(e.grupo)===-1;});
  var total    = opEts.length + extras.length;
  var conc     = opEts.filter(function(e){return map[e.id]&&map[e.id].concluida;}).length;
  extras.forEach(function(ex){if(map[ex.id]&&map[ex.id].concluida)conc++;});
  return {conc:conc,total:total,pct:total>0?Math.round(conc/total*100):0};
}

function calcTimeline(o,concOp,totalOp){
  if(!o.data_inicio||!o.data_entrega_prevista) return null;
  if(o.status==='finalizada') return {status:'adiantada',label:'Concluída'};
  var start=new Date(o.data_inicio),end=new Date(o.data_entrega_prevista),now=new Date();
  var dur=end-start; if(dur<=0) return null;
  var diff=(totalOp>0?concOp/totalOp:0)-((now-start)/dur);
  if(diff>0.20) return {status:'adiantada',label:'Adiantada'};
  if(diff>=0)   return {status:'prazo',label:'No Prazo'};
  return {status:'atrasada',label:'Atrasada'};
}

function getProximaEtapa(obraId){
  var map=ENG.etapasMap[obraId]||{};
  var o=ENG.obras.find(function(x){return x.id===obraId;})||{};
  var proxima=getAllEtapasObra(o).find(function(e){return GRUPOS_NAO_OP.indexOf(e.grupo)===-1&&(!map[e.id]||!map[e.id].concluida);});
  if(proxima) return '▸ '+proxima.label;
  var ext=(o.itens_extras||[]).find(function(ex){return !map[ex.id]||!map[ex.id].concluida;});
  if(ext) return '▸ '+ext.label;
  return '✓ Todas as etapas concluídas';
}

function checkBloqueio(obraId,novoStatus){
  var o=ENG.obras.find(function(x){return x.id===obraId;});
  var allEts=getAllEtapasObra(o);
  var map=ENG.etapasMap[obraId]||{};
  var colIdx=COLUNAS.findIndex(function(c){return c.id===novoStatus;});
  var prevCols=COLUNAS.slice(0,colIdx).map(function(c){return c.id;});
  return allEts.filter(function(e){return prevCols.indexOf(e.coluna)!==-1&&e.obrigatorio&&(!map[e.id]||!map[e.id].concluida);});
}

async function doLogin(){
  var email=document.getElementById('loginEmail').value.trim();
  var senha=document.getElementById('loginSenha').value;
  var btn=document.getElementById('loginBtn');
  document.getElementById('loginErr').style.display='none';
  if(!email||!senha){mostrarErro('Preencha e-mail e senha.');return;}
  btn.textContent='Entrando...';btn.disabled=true;
  try{
    var r=await supaAuth(email,senha);
    if(r.error){mostrarErro(r.error);return;}
    SUPA_TOKEN=r.data.access_token;
    await iniciarSessao(r.data,r.data.user);
  }catch(e){mostrarErro('Erro: '+e.message);}
  finally{btn.textContent='Entrar';btn.disabled=false;}
}
function mostrarErro(msg){var el=document.getElementById('loginErr');el.textContent=msg;el.style.display='block';}
async function iniciarSessao(session,user){
  ENG.user=user;
  try{
    var{data:perfil}=await supaGetOne('ecm_perfis','id=eq.'+user.id);
    if(!perfil) throw new Error('Perfil não encontrado. Crie seu usuário no Ecosistema primeiro.');
    ENG.perfil=perfil;
    document.getElementById('sbAv').textContent=(perfil.nome||'?')[0].toUpperCase();
    document.getElementById('sbNome').textContent=perfil.nome||'—';
    document.getElementById('sbRole').textContent=perfil.cargo||perfil.perfil||'—';
    localStorage.setItem('ecm_session',JSON.stringify({id:user.id,email:user.email,nome:perfil.nome,perfil:perfil.perfil,access_token:session.access_token}));
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('appShell').style.display='block';
    await loadTipos();
    navigate('dashboard');
  }catch(e){mostrarErro(e.message);SUPA_TOKEN=null;}
}
async function doLogout(){
  await supaSignOut();localStorage.removeItem('ecm_session');
  ENG={user:null,perfil:null,obras:[],etapasMap:{},tipos:[],tipoEtapasMap:{},unidades:[],unidadeMap:{}};
  document.getElementById('appShell').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('loginSenha').value='';
}

function navigate(view){
  document.querySelectorAll('.view').forEach(function(v){v.classList.remove('active');});
  document.querySelectorAll('.nav-item').forEach(function(n){n.classList.remove('active');});
  var el=document.getElementById('view-'+view); if(el) el.classList.add('active');
  var ni=document.getElementById('nav-'+view);  if(ni) ni.classList.add('active');
  var titles={dashboard:'Dashboard',kanban:'Kanban de Obras',config:'Configurações'};
  document.getElementById('tbTitle').textContent=titles[view]||view;
  document.getElementById('tbNovaObra').style.display=(view==='kanban')?'block':'none';
  if(view==='dashboard')  renderDashboard();
  else if(view==='kanban') renderKanban();
  else if(view==='config') renderConfig();
}

// CARREGAR DADOS

async function loadTipos(){
  var[tiposRes,unRes]= await Promise.all([
    supaGet('ecm_tipos_cobertura','order=ordem.asc,nome.asc'),
    supaGet('ecm_unidades','ativo=eq.true&order=nome.asc','id,nome,estado,cor')
  ]);
  ENG.tipos=tiposRes.data||[];
  ENG.unidades=unRes.data||[];
  ENG.unidadeMap={};
  ENG.unidades.forEach(function(u){ENG.unidadeMap[u.id]=u;});
  if(ENG.tipos.length){
    var{data:ets}=await supaGet('ecm_tipo_etapas','order=tipo_id,ordem.asc');
    ENG.tipoEtapasMap={};
    (ets||[]).forEach(function(e){
      if(!ENG.tipoEtapasMap[e.tipo_id]) ENG.tipoEtapasMap[e.tipo_id]=[];
      ENG.tipoEtapasMap[e.tipo_id].push(e);
    });
  }
}

async function loadObras(){
  var{data}=await supaGet('ecm_obras','order=created_at.desc');
  ENG.obras=data||[];
  if(ENG.obras.length){
    var{data:ets}=await supaGet('ecm_obra_etapas','order=obra_id');
    ENG.etapasMap={};
    (ets||[]).forEach(function(e){
      if(!ENG.etapasMap[e.obra_id]) ENG.etapasMap[e.obra_id]={};
      ENG.etapasMap[e.obra_id][e.etapa_id]=e;
    });
  }
}

// ════════════════════════════════════════════
// DASHBOARD
// ════════════════════════════════════════════
async function renderDashboard(){
  var el=document.getElementById('dashContent');
  el.innerHTML='<div class="empty">Carregando...</div>';
  await loadObras();
  var obras=ENG.obras;
  var ativas=obras.filter(function(o){return o.status!=='finalizada';});
  var totalValor=ativas.reduce(function(s,o){return s+(o.valor_contrato||0);},0);
  var totalVagas=ativas.reduce(function(s,o){return s+(o.vagas||0);},0);
  var pendencias=[];
  ativas.forEach(function(o){
    var bloq=checkBloqueio(o.id,COLUNAS[COLUNAS.findIndex(function(c){return c.id===o.status;})+1]?.id||'');
    bloq.forEach(function(e){pendencias.push({obra:o.nome,etapa:e.label,atrasada:o.data_entrega_prevista&&new Date(o.data_entrega_prevista)<new Date()});});
  });
  var funnelHtml=COLUNAS.map(function(c){
    var n=obras.filter(function(o){return o.status===c.id;}).length;
    return '<div class="funil-item"><div class="funil-dot" style="background:'+c.cor+'"></div><span class="funil-col-name">'+c.label+'</span><span class="funil-count">'+n+'</span></div>';
  }).join('');
  var pendHtml=pendencias.slice(0,6).map(function(p){
    return '<div class="pend-item"><span class="pend-badge '+(p.atrasada?'atrasada':'pendente')+'">'+(p.atrasada?'Atrasada':'Pendente')+'</span><div><div class="pend-obra">'+esc(p.obra)+'</div><div class="pend-etapa">'+esc(p.etapa)+'</div></div></div>';
  }).join('')||'<div class="empty" style="padding:16px">Nenhuma pendência crítica</div>';
  el.innerHTML=
  '<div class="kpi-row">'+
    kpiCard('Obras Ativas',ativas.length,'em andamento','verde')+
    kpiCard('Valor em Execução','R$ '+fmtMoeda(totalValor),'total das obras ativas','azul')+
    kpiCard('Vagas Contratadas',totalVagas,'total das obras ativas','amarelo')+
    kpiCard('Pendências Críticas',pendencias.length,'etapas bloqueando avanço','vermelho')+
  '</div>'+
  '<div class="funil-row">'+
    '<div class="card-blk"><div class="card-blk-title">Funil de Obras por Etapa</div>'+funnelHtml+'</div>'+
    '<div class="card-blk"><div class="card-blk-title">Pendências Críticas</div>'+pendHtml+'</div>'+
  '</div>';
}
function kpiCard(label,val,sub,cls){return '<div class="kpi '+(cls||'')+'"><div class="kpi-val">'+val+'</div><div class="kpi-label">'+label+'</div><div class="kpi-sub">'+sub+'</div></div>';}

// ════════════════════════════════════════════
// KANBAN
// ════════════════════════════════════════════
async function renderKanban(){
  var el=document.getElementById('kanbanWrap');
  el.innerHTML='<div class="empty">Carregando...</div>';
  await loadObras();
  var html='';
  COLUNAS.forEach(function(col){
    var obras=ENG.obras.filter(function(o){return o.status===col.id;});
    html+='<div class="kanban-col" id="col-'+col.id+'">'+
      '<div class="col-header">'+
        '<div class="col-dot" style="background:'+col.cor+'"></div>'+
        '<span class="col-name">'+col.label+'</span>'+
        '<span class="col-count">'+obras.length+'</span>'+
      '</div>'+
      '<div class="col-cards" id="cards-'+col.id+'" data-col="'+col.id+'">'+obras.map(buildCard).join('')+'</div>'+
      '<div class="col-add" onclick="novaObraNaColuna(\''+col.id+'\')">+ Nova obra</div>'+
    '</div>';
  });
  el.innerHTML=html;
  COLUNAS.forEach(function(col){
    var container=document.getElementById('cards-'+col.id);
    if(container) Sortable.create(container,{group:'obras',animation:150,ghostClass:'sortable-ghost',dragClass:'sortable-drag',onEnd:function(evt){var obraId=evt.item.dataset.id;var novoStatus=evt.to.dataset.col;var oldStatus=evt.from.dataset.col;if(novoStatus!==oldStatus)moverObra(obraId,novoStatus,oldStatus,evt);}});
  });
}

function buildCard(o){
  var prog=calcProgresso(o.id);
  var tl=calcTimeline(o,prog.conc,prog.total);
  var proxima=getProximaEtapa(o.id);
  var tipo=ENG.tipos.find(function(t){return t.id===o.tipo_cobertura_id;});
  var tipoLabel=tipo?tipo.nome:(o.produto||'Sem tipo');
  var extras=o.itens_extras||[];
  var atrasada=o.data_entrega_prevista&&new Date(o.data_entrega_prevista)<new Date()&&o.status!=='finalizada';
  var un=o.unidade_id?ENG.unidadeMap[o.unidade_id]:null;
  var unBadge=un?'<div style="position:absolute;top:8px;right:8px;background:'+(un.cor||'#64748b')+';color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:20px;letter-spacing:.5px">'+(un.estado||un.nome.slice(0,2).toUpperCase())+'</div>':'';
  return '<div class="obra-card" data-id="'+o.id+'" onclick="abrirObra(\''+o.id+'\')" style="position:relative">'+
    unBadge+
    '<div class="card-nome">'+esc(o.nome)+'</div>'+
    '<div class="card-cliente">'+esc(o.cliente||'—')+'</div>'+
    '<div class="card-phase">'+esc(proxima)+'</div>'+
    '<div class="card-meta">'+
      '<span class="card-tag" title="'+esc(tipoLabel)+'">'+esc(tipoLabel.length>20?tipoLabel.slice(0,18)+'…':tipoLabel)+'</span>'+
      (extras.length?'<span class="card-tag extras">+'+extras.length+' extra'+(extras.length>1?'s':'')+'</span>':'')+
      (atrasada?'<span class="card-tag warn">⚠ Atrasada</span>':'')+
      (tl?'<span class="timeline-badge tl-'+tl.status+'">'+tl.label+'</span>':'')+
    '</div>'+
    '<div class="card-progress"><div class="card-progress-bar" style="width:'+prog.pct+'%"></div></div>'+
    '<div class="card-footer">'+
      '<span class="card-data">'+(o.data_entrega_prevista?'📅 '+fmtData(o.data_entrega_prevista):'')+'</span>'+
      '<span class="card-vagas">'+(o.vagas?o.vagas+'v ':'')+prog.pct+'%</span>'+
    '</div>'+
  '</div>';
}

async function moverObra(obraId,novoStatus,oldStatus,evt){
  var bloqueados=checkBloqueio(obraId,novoStatus);
  if(bloqueados.length){
    var fromC=document.getElementById('cards-'+oldStatus);
    fromC.insertBefore(evt.item,fromC.children[evt.oldIndex]||null);
    showToast('⚠ Pendente: '+bloqueados.map(function(e){return e.label;}).join(', '),'error');
    return;
  }
  var{error}=await supaPatch('ecm_obras','id=eq.'+obraId,{status:novoStatus});
  if(error){showToast('Erro ao mover obra.','error');return;}
  var o=ENG.obras.find(function(x){return x.id===obraId;});
  if(o) o.status=novoStatus;
  var col=COLUNAS.find(function(c){return c.id===novoStatus;});
  await supaPost('ecm_obra_historico',{obra_id:obraId,tipo:'status',descricao:(ENG.perfil.nome||'Usuário')+' moveu para '+(col?col.label:novoStatus),usuario_nome:ENG.perfil.nome});
  COLUNAS.forEach(function(c){var el=document.querySelector('#col-'+c.id+' .col-count');if(el)el.textContent=document.getElementById('cards-'+c.id).querySelectorAll('.obra-card').length;});
  showToast('Obra movida para '+(col?col.label:novoStatus),'success');
}

  var bonus=[];
  PRODUTOS_BONUS.forEach(function(p,i){

    if(cb&&cb.checked) bonus.push({id:'bonus_'+i+'_'+Date.now(),label:p});

async function salvarNovaObra(){
  var nome=(document.getElementById('no_nome').value||'').trim();
  var cliente=(document.getElementById('no_cliente').value||'').trim();
  var tipoId=document.getElementById('no_tipo').value;
  if(!nome){showToast('Informe o nome da obra.','error');return;}
  if(!cliente){showToast('Informe o cliente.','error');return;}
  if(!tipoId){showToast('Selecione o tipo de cobertura.','error');return;}
  var bonus=getBonusSelecionados();
  var extrasValidos=_extrasNova.filter(function(e){return e.label.trim();}).map(function(e){return{id:e.id,label:e.label.trim()};});
  var itensExtras=bonus.concat(extrasValidos);
  var tipo=ENG.tipos.find(function(t){return t.id===tipoId;});
  var{data,error}=await supaPost('ecm_obras',{
    nome,cliente,
    produto:tipo?tipo.nome:'',
    tipo_cobertura_id:tipoId,
    vagas:parseInt(document.getElementById('no_vagas').value)||0,
    valor_contrato:parseFloat(document.getElementById('no_valor').value)||0,
    status:document.getElementById('no_status').value||'contrato',
    lider_obra:(document.getElementById('no_lider').value||'').trim(),
    responsavel_eng:(document.getElementById('no_resp').value||'').trim(),
    data_inicio:document.getElementById('no_inicio').value||null,
    data_entrega_prevista:document.getElementById('no_entrega').value||null,
    observacoes:(document.getElementById('no_obs').value||'').trim(),
    unidade_id:document.getElementById('no_unidade').value||null,
    itens_extras:itensExtras,ativo:true,
  });
  if(error){showToast('Erro: '+error,'error');return;}
  if(data&&data.id) await supaPost('ecm_obra_historico',{obra_id:data.id,tipo:'criacao',descricao:'Obra criada por '+(ENG.perfil.nome||'usuário'),usuario_nome:ENG.perfil.nome});
  closeModal();showToast('Obra criada!','success');await renderKanban();
}

async function renderObraModal(id,tab){
  _obraTab=tab;
  var o=ENG.obras.find(function(x){return x.id===id;}); if(!o) return;
  var col=COLUNAS.find(function(c){return c.id===o.status;})||{};
  var tipo=ENG.tipos.find(function(t){return t.id===o.tipo_cobertura_id;});
  document.getElementById('obraModalTitle').textContent=o.nome;
  document.getElementById('obraModalSub').innerHTML='<span class="badge bg-blue">'+esc(o.cliente||'—')+'</span>&nbsp;<span class="badge bg-gray">'+(col.label||o.status)+'</span>'+(tipo?'&nbsp;<span class="badge bg-green">'+esc(tipo.nome)+'</span>':'');
  var tabs=[{id:'resumo',label:'Resumo'},{id:'etapas',label:'Checklist'},{id:'diario',label:'Diário'},{id:'quantitativos',label:'Quantitativos'},{id:'historico',label:'Histórico'}];
  document.getElementById('obraTabs').innerHTML=tabs.map(function(t){return '<div class="modal-tab'+(t.id===tab?' active':'')+'" onclick="renderObraModal(\''+id+'\',\''+t.id+'\')">'+t.label+'</div>';}).join('');
  var body=document.getElementById('obraBody'),footer=document.getElementById('obraFooter');
  if(tab==='resumo')           renderResumoTab(o,body,footer);
  else if(tab==='etapas')      await renderEtapasTab(o,body,footer);
  else if(tab==='diario')      await renderDiarioTab(o,body,footer);
  else if(tab==='quantitativos') renderQuantitativosTab(o,body,footer);
  else if(tab==='historico')   await renderHistoricoTab(o,body,footer);
}

async function renderEtapasTab(o,body,footer){
  var{data:ets}=await supaGet('ecm_obra_etapas','obra_id=eq.'+o.id);
  var etMap={};(ets||[]).forEach(function(e){etMap[e.etapa_id]=e;});
  ENG.etapasMap[o.id]=etMap;
  var allEts=getAllEtapasObra(o);
  var grupos={};
  allEts.forEach(function(e){if(!grupos[e.grupo])grupos[e.grupo]=[];grupos[e.grupo].push(e);});
  var html='';
  Object.keys(grupos).forEach(function(g){
    var naoOp=GRUPOS_NAO_OP.indexOf(g)!==-1;
    html+='<div class="etapa-group"><div class="etapa-group-title">'+g+(naoOp?' <span style="font-weight:400;font-size:10px">(não conta no %)</span>':'')+'</div>';
    grupos[g].forEach(function(e){
      var reg=etMap[e.id],done=reg&&reg.concluida;
      var dataStr=done&&reg.concluida_em?'✓ '+fmtDataHora(reg.concluida_em):'';
      html+='<div class="etapa-item'+(done?' done':'')+'" onclick="toggleEtapa(\''+o.id+'\',\''+e.id+'\','+done+')">'+
        '<div class="etapa-cb"></div>'+
        '<div class="etapa-label">'+esc(e.label)+'</div>'+
        (e.obrigatorio&&!naoOp?'<span class="etapa-obrig">bloqueante</span>':'')+
        '<div class="etapa-data">'+dataStr+'</div>'+
      '</div>';
    });
    html+='</div>';
  });
  var extras=o.itens_extras||[];
  if(extras.length){
    html+='<div class="etapa-group"><div class="etapa-group-title">Serviços Extras</div>';
    extras.forEach(function(ex){
      var reg=etMap[ex.id],done=reg&&reg.concluida;
      var dataStr=done&&reg.concluida_em?'✓ '+fmtDataHora(reg.concluida_em):'';
      html+='<div class="etapa-item'+(done?' done':'')+'" onclick="toggleEtapa(\''+o.id+'\',\''+ex.id+'\','+done+')">'+
        '<div class="etapa-cb"></div><div class="etapa-label">'+esc(ex.label)+'</div>'+
        '<div class="etapa-data">'+dataStr+'</div></div>';
    });
    html+='</div>';
  }
  body.innerHTML=html;
  var prog=calcProgresso(o.id);
  footer.innerHTML='<div style="flex:1;font-size:12px;color:var(--text-2)">'+prog.conc+'/'+prog.total+' etapas operacionais ('+prog.pct+'%)</div><button class="btn btn-primary" onclick="closeObraModal()">Fechar</button>';
}

async function toggleEtapa(obraId,etapaId,jaDone){
  var novo=!jaDone;
  var{data:existente}=await supaGetOne('ecm_obra_etapas','obra_id=eq.'+obraId+'&etapa_id=eq.'+etapaId);
  if(existente){await supaPatch('ecm_obra_etapas','id=eq.'+existente.id,{concluida:novo,concluida_em:novo?new Date().toISOString():null});}
  else{await supaPost('ecm_obra_etapas',{obra_id:obraId,etapa_id:etapaId,concluida:novo,concluida_em:novo?new Date().toISOString():null});}
  var o=ENG.obras.find(function(x){return x.id===obraId;})||{};
  var allEts=getAllEtapasObra(o);
  var et=allEts.find(function(e){return e.id===etapaId;})||((o.itens_extras||[]).find(function(e){return e.id===etapaId;}));
  var lbl=et?et.label:etapaId;
  await supaPost('ecm_obra_historico',{obra_id:obraId,tipo:'etapa',descricao:(novo?'✓ Concluiu: ':'○ Desconclui: ')+lbl,usuario_nome:ENG.perfil.nome});
  showToast(novo?'Etapa concluída!':'Etapa desmarcada.','success');
  if(o) await renderObraModal(obraId,'etapas');
}

  var{error}=await supaPatch('ecm_obra_diario','id=eq.'+diarioId,{data,clima:document.getElementById('d_clima').value,equipe:(document.getElementById('d_equipe').value||'').trim(),atividades:ativ,pendencias:(document.getElementById('d_pend').value||'').trim(),proximos_passos:(document.getElementById('d_prox').value||'').trim()});
  if(error){showToast('Erro: '+error,'error');return;}
  closeModal();showToast('Entrada atualizada!','success');
  var o=ENG.obras.find(function(x){return x.id===obraId;});if(o) await renderObraModal(obraId,'diario');
}

// ── QUANTITATIVOS ──
function renderQuantitativosTab(o,body,footer){
  body.innerHTML=
  '<div class="quant-inputs">'+
    '<div class="fg"><label>Número de Pés</label><input type="number" id="qt_pes" value="'+(o.num_pes||0)+'" min="0" oninput="calcQuant()"></div>'+
    '<div class="fg"><label>Número de Braços</label><input type="number" id="qt_bracos" value="'+(o.num_bracos||0)+'" min="0"></div>'+
    '<div class="fg"><label>Número de Arcos</label><input type="number" id="qt_arcos" value="'+(o.num_arcos||0)+'" min="0"></div>'+
    '<div class="fg"><label>Número de Telas</label><input type="number" id="qt_telas" value="'+(o.num_telas||0)+'" min="0"></div>'+
  '</div>'+
  '<div id="quantResult"></div>';
  calcQuant();
  footer.innerHTML='<button class="btn btn-ghost" onclick="salvarQuantitativos(\''+o.id+'\')">💾 Salvar</button><button class="btn btn-primary" onclick="closeObraModal()">Fechar</button>';
}
function calcQuant(){
  var pes=parseInt(document.getElementById('qt_pes').value)||0;
  var el=document.getElementById('quantResult'); if(!el) return;
  if(pes===0){el.innerHTML='<div class="empty" style="padding:24px">Informe o número de pés para calcular as fundações.</div>';return;}
  var vol_terra=pes*0.192,vol_emp=vol_terra*1.30,num_cac=Math.ceil(vol_emp/6);
  var num_bet=Math.ceil(vol_terra/0.120),la=num_bet*6.4,lb=num_bet*7.6;
  el.innerHTML='<div class="quant-result">'+
    '<div class="quant-section">Escavação e Aterro</div>'+
    qLine('Volume por buraco (40×40×120cm)','0,192 m³')+
    qLine('Volume total de terra ('+pes+' pés)',vol_terra.toFixed(3)+' m³')+
    qLine('Volume empolado (×1,30)',vol_emp.toFixed(3)+' m³')+
    qLine('Caçambas (6m³ cada)',num_cac+' caçamba'+(num_cac!==1?'s':''))+
    '<div class="quant-divider"></div>'+
    '<div class="quant-section">Concreto de Fundação</div>'+
    qLine('Volume de concreto',vol_terra.toFixed(3)+' m³')+
    qLine('Betoneiras (120L cada)',num_bet+' betoneira'+(num_bet!==1?'s':''))+
    qLine('Cimento',num_bet+' saco'+(num_bet!==1?'s':'')+' (1 por betoneira)')+
    qLine('Areia',(la*0.018).toFixed(3)+' m³ — '+Math.ceil(la)+' latas (6,4/betoneira)')+
    qLine('Brita',(lb*0.018).toFixed(3)+' m³ — '+Math.ceil(lb)+' latas (7,6/betoneira)')+
  '</div>';
}
function qLine(l,v){return '<div class="quant-line"><span class="quant-label">'+l+'</span><span class="quant-val">'+v+'</span></div>';}
async function salvarQuantitativos(obraId){
  var pes=parseInt(document.getElementById('qt_pes').value)||0;
  var bracos=parseInt(document.getElementById('qt_bracos').value)||0;
  var arcos=parseInt(document.getElementById('qt_arcos').value)||0;
  var telas=parseInt(document.getElementById('qt_telas').value)||0;
  var{error}=await supaPatch('ecm_obras','id=eq.'+obraId,{num_pes:pes,num_bracos:bracos,num_arcos:arcos,num_telas:telas});
  if(error){showToast('Erro: '+error,'error');return;}
  var o=ENG.obras.find(function(x){return x.id===obraId;});
  if(o){o.num_pes=pes;o.num_bracos=bracos;o.num_arcos=arcos;o.num_telas=telas;}
  showToast('Quantitativos salvos!','success');
}

// EDITAR OBRA

function editarObra(id){
  var o=ENG.obras.find(function(x){return x.id===id;}); if(!o) return;
  _extrasEdit=(o.itens_extras||[]).filter(function(e){return PRODUTOS_BONUS.indexOf(e.label)===-1;}).map(function(e){return{id:e.id||'ex_'+Date.now(),label:e.label||''};});
  var tipoOpts=ENG.tipos.map(function(t){return '<option value="'+t.id+'"'+(t.id===o.tipo_cobertura_id?' selected':'')+'>'+esc(t.nome)+'</option>';}).join('');
  var colOpts=COLUNAS.map(function(c){return '<option value="'+c.id+'"'+(c.id===o.status?' selected':'')+'>'+c.label+'</option>';}).join('');
  var unOpts='<option value="">— Sem unidade —</option>'+ENG.unidades.map(function(u){return '<option value="'+u.id+'"'+(u.id===o.unidade_id?' selected':'')+'>'+esc(u.nome)+(u.estado?' ('+u.estado+')':'')+'</option>';}).join('');
  var bonusHtml=PRODUTOS_BONUS.map(function(p,i){
    var sel=(o.itens_extras||[]).some(function(e){return e.label===p;});
    return '<label class="bonus-chip'+(sel?' selected':'')+'" id="ebc_'+i+'">'+
      '<input type="checkbox" id="enb_'+i+'" value="'+esc(p)+'"'+(sel?' checked':'')+' onchange="toggleEditBonus('+i+')">'+esc(p)+'</label>';
  }).join('');
  openModal('Editar Obra — '+esc(o.nome),
    '<div class="form-grid">'+
    '<div class="fg full"><label>Nome *</label><input id="eo_nome" value="'+esc(o.nome)+'"></div>'+
    '<div class="fg"><label>Cliente *</label><input id="eo_cliente" value="'+esc(o.cliente||'')+'"></div>'+
    '<div class="fg"><label>Etapa</label><select id="eo_status">'+colOpts+'</select></div>'+
    '<div class="fg"><label>Vagas</label><input type="number" id="eo_vagas" value="'+(o.vagas||0)+'"></div>'+
    '<div class="fg"><label>Valor do Contrato (R$)</label><input type="number" id="eo_valor" value="'+(o.valor_contrato||0)+'" step="0.01"></div>'+
    '<div class="fg"><label>Líder de Obra</label><input id="eo_lider" value="'+esc(o.lider_obra||'')+'"></div>'+
    '<div class="fg"><label>Resp. Engenharia</label><input id="eo_resp" value="'+esc(o.responsavel_eng||'')+'"></div>'+
    '<div class="fg"><label>Unidade</label><select id="eo_unidade">'+unOpts+'</select></div>'+
    '<div class="fg"><label>Data de Início</label><input type="date" id="eo_inicio" value="'+(o.data_inicio||'')+'"></div>'+
    '<div class="fg"><label>Previsão de Entrega</label><input type="date" id="eo_entrega" value="'+(o.data_entrega_prevista||'')+'"></div>'+
    '<div class="fg full"><label>Tipo de Cobertura</label>'+
    '<select id="eo_tipo" onchange="previewTipo(\'eo_preview\')"><option value="">Selecione...</option>'+tipoOpts+'</select>'+
    '<div id="eo_preview"></div></div>'+
    '<div class="fg full"><label>Serviços Extras (bonificações)</label><div class="bonus-grid">'+bonusHtml+'</div></div>'+
    '<div class="fg full"><label>Itens Extras Adicionais</label>'+
    '<div id="extrasEdit" style="margin-top:4px"></div>'+
    '<button class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="addExtraEdit()">+ Adicionar item extra</button></div>'+
    '<div class="fg full"><label>Observações</label><textarea id="eo_obs">'+esc(o.observacoes||'')+'</textarea></div>'+
    '</div>',
    '<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>'+
    '<button class="btn btn-primary" onclick="salvarEdicaoObra(\''+id+'\')">Salvar</button>'
  );
  setTimeout(function(){renderExtrasEdit();previewTipo('eo_preview');},60);
}

function toggleEditBonus(i){var cb=document.getElementById('enb_'+i);var lbl=document.getElementById('ebc_'+i);if(lbl)lbl.classList.toggle('selected',cb&&cb.checked);}
function addExtraEdit(){_extrasEdit.push({id:'ex_'+Date.now()+'_'+Math.random().toString(36).slice(2),label:''});renderExtrasEdit();}
function removeExtraEdit(id){_extrasEdit=_extrasEdit.filter(function(e){return e.id!==id;});renderExtrasEdit();}
function renderExtrasEdit(){
  var el=document.getElementById('extrasEdit');if(!el)return;
  el.innerHTML=_extrasEdit.map(function(ex,i){
    return '<div class="extra-item"><input class="extra-inp" placeholder="Ex: Ar condicionado..." value="'+esc(ex.label)+'" oninput="_extrasEdit['+i+'].label=this.value"><button class="btn btn-ghost btn-sm" style="color:#dc2626;border-color:#fca5a5;flex-shrink:0" onclick="removeExtraEdit(\''+ex.id+'\')">✕</button></div>';
  }).join('');
}
function getEditBonusSelecionados(){
  var bonus=[];
  PRODUTOS_BONUS.forEach(function(p,i){var cb=document.getElementById('enb_'+i);if(cb&&cb.checked)bonus.push({id:'bonus_'+i,label:p});});
  return bonus;
}

async function salvarEdicaoObra(id){
  var nome=(document.getElementById('eo_nome').value||'').trim();
  var cliente=(document.getElementById('eo_cliente').value||'').trim();
  if(!nome||!cliente){showToast('Nome e cliente são obrigatórios.','error');return;}
  var tipoId=document.getElementById('eo_tipo').value;
  var tipo=ENG.tipos.find(function(t){return t.id===tipoId;});
  var bonus=getEditBonusSelecionados();
  var extrasValidos=_extrasEdit.filter(function(e){return e.label.trim();}).map(function(e){return{id:e.id,label:e.label.trim()};});
  var{error}=await supaPatch('ecm_obras','id=eq.'+id,{
    nome,cliente,
    produto:tipo?tipo.nome:'',
    tipo_cobertura_id:tipoId||null,
    vagas:parseInt(document.getElementById('eo_vagas').value)||0,
    valor_contrato:parseFloat(document.getElementById('eo_valor').value)||0,
    status:document.getElementById('eo_status').value,
    lider_obra:(document.getElementById('eo_lider').value||'').trim(),
    responsavel_eng:(document.getElementById('eo_resp').value||'').trim(),
    data_inicio:document.getElementById('eo_inicio').value||null,
    data_entrega_prevista:document.getElementById('eo_entrega').value||null,
    observacoes:(document.getElementById('eo_obs').value||'').trim(),
    unidade_id:document.getElementById('eo_unidade').value||null,
    itens_extras:bonus.concat(extrasValidos),
  });
  if(error){showToast('Erro: '+error,'error');return;}
  closeModal();showToast('Obra atualizada!','success');
  await loadObras();closeObraModal();navigate('kanban');await renderKanban();
}

async function confirmarExcluirObra(id,nome){
  if(!confirm('Excluir a obra "'+nome+'"? Esta ação não pode ser desfeita.')) return;
  await supaDelete('ecm_obras','id=eq.'+id);
  closeObraModal();showToast('Obra excluída.','success');await renderKanban();
}

function abrirNovoTipo(){
  openModal('Novo Tipo de Cobertura',
    '<div class="form-grid"><div class="fg full"><label>Nome do Tipo *</label><input id="nt_nome" placeholder="Ex: Sombrite Garagem, Telha Galvalume..."></div></div>',
    '<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>'+
    '<button class="btn btn-primary" onclick="salvarNovoTipo()">Criar</button>'

async function salvarNovoTipo(){
  var nome=(document.getElementById('nt_nome').value||'').trim();
  if(!nome){showToast('Informe o nome do tipo.','error');return;}
  var{error}=await supaPost('ecm_tipos_cobertura',{nome,ativo:true,ordem:ENG.tipos.length+1});
  if(error){showToast('Erro: '+error,'error');return;}
  closeModal();showToast('Tipo criado!','success');await renderConfig();
}

async function excluirTipo(id,nome){
  if(!confirm('Excluir o tipo "'+nome+'"? Obras existentes perderão o vínculo com este tipo.')) return;
  await supaDelete('ecm_tipos_cobertura','id=eq.'+id);
  showToast('Tipo excluído.','success');await renderConfig();
}

function abrirEditTipo(tipoId){
  _editTipoId=tipoId;
  _editTipoEtapas=(ENG.tipoEtapasMap[tipoId]||[]).map(function(e){return Object.assign({},e);});
  var t=ENG.tipos.find(function(x){return x.id===tipoId;})||{};
  openModal('Editar Tipo: '+esc(t.nome),buildEditTipoBody(),
    '<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>'+
    '<button class="btn btn-primary" onclick="salvarEditTipo()">Salvar Tudo</button>'
  );
}

function buildEditTipoBody(){
  var rows=_editTipoEtapas.map(function(e,i){
    var grupoOpts=GRUPOS_OP.map(function(g){return '<option value="'+g+'"'+(g===e.grupo?' selected':'')+'>'+g+'</option>';}).join('');
    var colOpts=COLUNAS_OP.map(function(c){var col=COLUNAS.find(function(x){return x.id===c;});return '<option value="'+c+'"'+(c===e.coluna?' selected':'')+'>'+(col?col.label:c)+'</option>';}).join('');
    return '<div class="etapa-edit-row">'+
      '<input class="etapa-edit-inp" placeholder="Nome da etapa..." value="'+esc(e.label)+'" oninput="_editTipoEtapas['+i+'].label=this.value">'+
      '<select class="etapa-edit-sel" onchange="_editTipoEtapas['+i+'].grupo=this.value">'+grupoOpts+'</select>'+
      '<select class="etapa-edit-sel" onchange="_editTipoEtapas['+i+'].coluna=this.value">'+colOpts+'</select>'+
      '<label class="obrig-toggle" title="Bloqueante: impede avanço de coluna se não concluída">'+
        '<input type="checkbox"'+(e.obrigatorio?' checked':'')+' onchange="_editTipoEtapas['+i+'].obrigatorio=this.checked"> Bloqueante</label>'+
      '<button class="btn btn-ghost btn-sm" style="color:#dc2626;border-color:#fca5a5;flex-shrink:0" onclick="removeEditEtapa('+i+')">✕</button>'+
    '</div>';
  }).join('');
  return '<div style="font-size:12px;color:var(--text-2);margin-bottom:12px">Etapas exclusivas deste tipo (além das fixas de Contrato e Financiamento). <strong>Bloqueante</strong> impede a obra de avançar de coluna se não estiver concluída.</div>'+
    '<div style="display:grid;grid-template-columns:1fr 130px 130px auto auto;gap:8px;margin-bottom:8px;padding:0 0 4px;border-bottom:1px solid var(--border)">'+
      '<span style="font-size:10px;font-weight:700;color:var(--text-3)">ETAPA</span>'+
      '<span style="font-size:10px;font-weight:700;color:var(--text-3)">GRUPO</span>'+
      '<span style="font-size:10px;font-weight:700;color:var(--text-3)">COLUNA</span>'+
      '<span style="font-size:10px;font-weight:700;color:var(--text-3)">TIPO</span>'+
      '<span></span>'+
    '</div>'+
    '<div id="editEtapasRows">'+rows+'</div>'+
    '<button class="btn btn-ghost btn-sm" style="margin-top:10px" onclick="addEditEtapa()">+ Adicionar etapa</button>';
}

function addEditEtapa(){
  _editTipoEtapas.push({id:null,tipo_id:_editTipoId,label:'',grupo:'Execução',coluna:'instalacao',ordem:_editTipoEtapas.length+1,obrigatorio:false});
  document.getElementById('gmBody').innerHTML=buildEditTipoBody();
}
function removeEditEtapa(i){
  _editTipoEtapas.splice(i,1);
  document.getElementById('gmBody').innerHTML=buildEditTipoBody();
}

async function salvarEditTipo(){
  var validas=_editTipoEtapas.filter(function(e){return e.label.trim();});
  if(!validas.length&&!confirm('Salvar o tipo sem etapas operacionais?')) return;
  // Apaga etapas existentes e recria
  await supaDelete('ecm_tipo_etapas','tipo_id=eq.'+_editTipoId);
  for(var i=0;i<validas.length;i++){
    var e=validas[i];
    await supaPost('ecm_tipo_etapas',{tipo_id:_editTipoId,label:e.label.trim(),grupo:e.grupo,coluna:e.coluna,ordem:i+1,obrigatorio:!!e.obrigatorio});
  }
  closeModal();showToast('Tipo salvo!','success');await renderConfig();
}

var _tt;
function showToast(msg,type){var el=document.getElementById('toast');el.textContent=msg;el.className='show '+(type||'');clearTimeout(_tt);_tt=setTimeout(function(){el.className='';},3500);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtMoeda(v){return(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtData(s){if(!s)return'—';return new Date(s+'T12:00:00').toLocaleDateString('pt-BR');}
function fmtDataHora(s){if(!s)return'—';return new Date(s).toLocaleString('pt-BR');}
function infoBox(label,val){return '<div style="background:var(--bg);border-radius:9px;padding:12px"><div style="font-size:10px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">'+label+'</div><div style="font-size:13px;font-weight:600;color:var(--text)">'+esc(String(val||'—'))+'</div></div>';}

(async function boot(){
  try{
    var sess=JSON.parse(localStorage.getItem('ecm_session')||'null');
    if(sess&&sess.access_token&&sess.id){
      SUPA_TOKEN=sess.access_token;
      var{data:perfil}=await supaGetOne('ecm_perfis','id=eq.'+sess.id);
      if(perfil){
        ENG.user={id:sess.id,email:sess.email};ENG.perfil=perfil;
        document.getElementById('sbAv').textContent=(perfil.nome||'?')[0].toUpperCase();
        document.getElementById('sbNome').textContent=perfil.nome||'—';
        document.getElementById('sbRole').textContent=perfil.cargo||perfil.perfil||'—';
        document.getElementById('loginScreen').style.display='none';
        document.getElementById('appShell').style.display='block';
        await loadTipos();
        navigate('dashboard');return;
      }
      localStorage.removeItem('ecm_session');SUPA_TOKEN=null;
    }
  }catch(e){console.error('Boot:',e);}
})();
