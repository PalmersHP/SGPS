<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sombrear CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<meta name="theme-color" content="#72BF00">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sombrear CRM">
<style>
:root{
  --p:#72BF00;--a:#5a9900;--bg:#f0f7e6;--fn:'Montserrat',sans-serif;
  --txt:#1a2e0a;--card:#fff;--sb:#1a2e0a;--sb-txt:#8fba5e;
  --sb-active:#72BF00;--border:#d4edba;--muted:#5a7a3a;
  --danger:#ef4444;--success:#22c55e;--warn:#f59e0b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fn);background:var(--bg);color:var(--txt);min-height:100vh}

/* ── LOGIN ── */
#v-login{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg)}
.login-card{background:#fff;border-radius:16px;padding:44px 40px;width:100%;max-width:420px;box-shadow:0 4px 32px rgba(0,0,0,.09)}
.login-logo{text-align:center;margin-bottom:32px}
.login-logo-text{font-size:2rem;font-weight:700;color:var(--p);letter-spacing:-1px}
.login-logo-sub{font-size:.78rem;color:var(--muted);font-weight:500;margin-top:2px}
.field{margin-bottom:18px}
.field label{display:block;font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.field input,.field select{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:9px;font-family:var(--fn);font-size:.9rem;color:var(--txt);outline:none;transition:border-color .2s;background:#fff}
.field input:focus,.field select:focus{border-color:var(--p)}
.btn-prim{width:100%;padding:13px;background:var(--p);color:#fff;border:none;border-radius:9px;font-family:var(--fn);font-size:.95rem;font-weight:700;cursor:pointer;transition:background .2s;letter-spacing:.3px}
.btn-prim:hover{background:var(--a)}
.btn-prim:disabled{opacity:.6;cursor:not-allowed}
.btn-sec{padding:9px 18px;background:#f1f5f9;color:var(--muted);border:1.5px solid var(--border);border-radius:8px;font-family:var(--fn);font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s}
.btn-sec:hover{background:var(--border)}
.btn-danger{padding:9px 18px;background:#fef2f2;color:var(--danger);border:1.5px solid #fca5a5;border-radius:8px;font-family:var(--fn);font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s}
.btn-danger:hover{background:#fee2e2}
.err-msg{color:var(--danger);font-size:.8rem;margin-top:10px;text-align:center;display:none}
.ldr-msg{text-align:center;font-size:.82rem;color:var(--muted);margin-top:12px;display:none}

/* ── APP LAYOUT ── */
#app{display:none;height:100vh;overflow:hidden}
.app-wrap{display:flex;height:100vh}
#sidebar{width:60px;background:var(--sb);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px;flex-shrink:0;overflow:hidden}
.sb-logo{width:40px;height:40px;background:var(--p);border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;flex-shrink:0}
.sb-logo svg{width:24px;height:24px;fill:#fff}
.sb-btn{width:44px;height:44px;background:transparent;border:none;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--sb-txt);transition:all .2s;position:relative;flex-shrink:0}
.sb-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.sb-btn.active{background:var(--p);color:#fff}
.sb-btn svg{width:20px;height:20px}
.sb-spacer{flex:1}
.sb-sep{width:32px;height:1px;background:rgba(255,255,255,.1);margin:4px 0}
#main-content{flex:1;overflow:hidden;display:flex;flex-direction:column}
.view{display:none;height:100%;overflow-y:auto}
.view.active{display:flex;flex-direction:column}

/* ── TOPBAR ── */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:#fff;border-bottom:1px solid var(--border);flex-shrink:0}
.topbar-title{font-size:1.1rem;font-weight:700;color:var(--txt)}
.topbar-right{display:flex;align-items:center;gap:10px}
.user-chip{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--bg);border-radius:20px;font-size:.82rem;font-weight:600;color:var(--muted);cursor:default}
.user-chip-dot{width:8px;height:8px;border-radius:50%;background:var(--p)}

/* ── KANBAN ── */
#v-kanban{background:var(--bg)}
.kb-toolbar{display:flex;align-items:center;gap:12px;padding:14px 20px;background:#fff;border-bottom:1px solid var(--border);flex-shrink:0}
.kb-search{flex:1;max-width:280px;padding:8px 14px;border:1.5px solid var(--border);border-radius:8px;font-family:var(--fn);font-size:.88rem;color:var(--txt);outline:none;transition:border-color .2s;background:#fff}
.kb-search:focus{border-color:var(--p)}
.kb-board{display:flex;gap:0;overflow-x:auto;flex:1;padding:0;min-height:0}
.kb-col{min-width:240px;max-width:240px;background:#eef4e0;display:flex;flex-direction:column;border-right:1px solid var(--border);flex-shrink:0}
.kb-col-head{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;position:sticky;top:0;z-index:1}
.kb-col-badge{background:rgba(0,0,0,.12);color:inherit;border-radius:20px;padding:1px 8px;font-size:.72rem;font-weight:700}
.kb-col-body{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:80px}
.kb-col-body.drag-over{background:rgba(114,191,0,.12)}
.lead-card{background:#fff;border-radius:10px;padding:12px;cursor:pointer;border:1.5px solid transparent;transition:all .15s;border-left:3px solid var(--p);box-shadow:0 1px 4px rgba(0,0,0,.06)}
.lead-card:hover{box-shadow:0 3px 12px rgba(0,0,0,.1);transform:translateY(-1px)}
.lead-card.dragging{opacity:.5}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;margin-bottom:6px}
.card-nome{font-size:.83rem;font-weight:700;color:var(--txt);line-height:1.3;flex:1}
.card-valor{font-size:.78rem;color:var(--p);font-weight:700;margin-bottom:5px}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:4px}
.card-tipo{font-size:.7rem;color:var(--muted);background:var(--bg);padding:2px 7px;border-radius:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.card-resp{font-size:.7rem;color:#fff;background:var(--p);padding:2px 7px;border-radius:20px;font-weight:700}
.urg-badge{display:inline-block;padding:1px 7px;border-radius:20px;font-size:.68rem;font-weight:700;color:#fff;letter-spacing:.3px;flex-shrink:0}
.kb-col-add{padding:6px 8px;margin:0 8px 8px;background:transparent;border:1.5px dashed var(--border);border-radius:8px;font-family:var(--fn);font-size:.78rem;color:var(--muted);cursor:pointer;transition:all .15s;text-align:center;width:calc(100% - 16px)}
.kb-col-add:hover{background:rgba(114,191,0,.08);border-color:var(--p);color:var(--a)}

/* ── MODAIS ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:900;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:620px;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 8px 48px rgba(0,0,0,.18)}
.modal-lg{max-width:780px}
.modal-sm{max-width:420px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--border);flex-shrink:0}
.modal-head h3{font-size:1rem;font-weight:700;color:var(--txt)}
.modal-close{width:32px;height:32px;background:#f1f5f9;border:none;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1rem;color:var(--muted)}
.modal-close:hover{background:#e2e8f0}
.modal-body{overflow-y:auto;padding:22px 24px;flex:1}
.modal-foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;flex-shrink:0}

/* ── TABS ── */
.tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:18px}
.tab-btn{padding:9px 18px;background:transparent;border:none;border-bottom:2px solid transparent;margin-bottom:-2px;font-family:var(--fn);font-size:.82rem;font-weight:600;color:var(--muted);cursor:pointer;transition:all .2s}
.tab-btn.active{color:var(--p);border-bottom-color:var(--p)}
.tab-pane{display:none}
.tab-pane.active{display:block}

/* ── FORMS ── */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.fg input,.fg select,.fg textarea{width:100%;padding:9px 13px;border:1.5px solid var(--border);border-radius:8px;font-family:var(--fn);font-size:.88rem;color:var(--txt);outline:none;transition:border-color .2s;background:#fff}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--p)}
.fg textarea{resize:vertical;min-height:80px}
.fg-hint{font-size:.72rem;color:var(--muted);margin-top:3px}

/* ── DASHBOARD ── */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi-card{background:#fff;border-radius:12px;padding:18px 20px;border:1px solid var(--border)}
.kpi-label{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.kpi-val{font-size:1.6rem;font-weight:700;color:var(--txt)}
.kpi-sub{font-size:.75rem;color:var(--muted);margin-top:3px}
.section-card{background:#fff;border-radius:12px;padding:20px;border:1px solid var(--border);margin-bottom:16px}
.section-title{font-size:.9rem;font-weight:700;color:var(--txt);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.progress-bar-wrap{background:#f1f5f9;border-radius:20px;height:8px;overflow:hidden;margin:8px 0}
.progress-bar-fill{height:100%;border-radius:20px;transition:width .4s}

/* ── AGENDA ── */
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-nav{display:flex;align-items:center;gap:10px}
.cal-nav button{width:32px;height:32px;background:#f1f5f9;border:none;border-radius:8px;cursor:pointer;font-size:1rem}
.cal-nav button:hover{background:var(--border)}
.cal-title{font-size:1rem;font-weight:700;color:var(--txt)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dow{text-align:center;font-size:.7rem;font-weight:700;color:var(--muted);padding:6px 0;text-transform:uppercase}
.cal-day{background:#fff;border-radius:8px;min-height:80px;padding:6px;border:1px solid var(--border);cursor:pointer;transition:background .15s}
.cal-day:hover{background:var(--bg)}
.cal-day.today{border-color:var(--p);background:#f7fdf0}
.cal-day.other-month{opacity:.4}
.cal-day-num{font-size:.75rem;font-weight:700;color:var(--muted);margin-bottom:3px}
.cal-event{font-size:.68rem;background:var(--p);color:#fff;border-radius:4px;padding:1px 5px;margin-bottom:2px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-event.assembleia{background:var(--warn)}
.cal-event.cancelado{background:#94a3b8;text-decoration:line-through}
.cal-event.realizado{background:#22c55e}

/* ── TABELAS ── */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:8px 12px;border-bottom:2px solid var(--border);text-align:left;white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid #f1f5f9;font-size:.85rem;vertical-align:middle}
.tbl tr:hover td{background:#fafdf4}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:.72rem;font-weight:700}
.badge-green{background:#dcfce7;color:#166534}
.badge-red{background:#fee2e2;color:#991b1b}
.badge-yellow{background:#fef3c7;color:#92400e}
.badge-blue{background:#dbeafe;color:#1e40af}
.badge-gray{background:#f1f5f9;color:#475569}

/* ── VISITA CARD ── */
.vis-card{background:var(--bg);border-radius:10px;padding:12px 14px;border:1.5px solid var(--border);margin-bottom:8px;display:flex;flex-direction:column;gap:6px}
.vis-card-head{display:flex;align-items:center;justify-content:space-between}
.vis-card-date{font-size:.85rem;font-weight:700;color:var(--txt)}
.vis-card-meta{display:flex;gap:10px;font-size:.78rem;color:var(--muted)}
.btn-gcal{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:5px 12px;background:#fff;border:1.5px solid #4285f4;border-radius:7px;color:#4285f4;font-weight:600;font-size:.75rem;text-decoration:none;cursor:pointer;font-family:var(--fn)}
.btn-gcal:hover{background:#e8f0fe}

/* ── FOTOS ── */
.fotos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.foto-thumb{border-radius:8px;overflow:hidden;aspect-ratio:1;background:#f1f5f9;position:relative;cursor:pointer}
.foto-thumb img{width:100%;height:100%;object-fit:cover}
.foto-thumb-add{border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;color:var(--muted);font-size:.75rem;cursor:pointer;border-radius:8px;aspect-ratio:1}
.foto-thumb-add:hover{background:var(--bg);border-color:var(--p)}

/* ── PROPOSTA ── */
@media print{
  #sidebar,#main-content .topbar,.kb-toolbar,#modal-lead,#modal-novo-lead,#modal-visita,.loader-ov,.toast-wrap{display:none!important}
  #v-proposta{display:block!important}
  .prop-actions{display:none!important}
  body{background:#fff}
}
.prop-sheet{background:#fff;max-width:800px;margin:0 auto;padding:32px;border-radius:12px;border:1px solid var(--border)}
.prop-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;padding-bottom:18px;border-bottom:2px solid var(--p)}
.prop-empresa-nome{font-size:1.4rem;font-weight:700;color:var(--p)}
.prop-empresa-sub{font-size:.75rem;color:var(--muted)}
.prop-numero{text-align:right;font-size:.8rem;color:var(--muted)}
.prop-numero strong{font-size:1rem;color:var(--txt);display:block}
.prop-table{width:100%;border-collapse:collapse;margin:16px 0}
.prop-table th{background:var(--p);color:#fff;padding:9px 12px;font-size:.8rem;text-align:left}
.prop-table td{padding:9px 12px;border-bottom:1px solid var(--border);font-size:.85rem}
.prop-total-row td{font-weight:700;background:var(--bg)}
.prop-obs{background:var(--bg);border-radius:8px;padding:14px;font-size:.82rem;margin-top:16px}
.prop-sign{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:32px}
.sign-box{border-top:1.5px solid var(--txt);padding-top:8px;font-size:.78rem;text-align:center;color:var(--muted)}

/* ── LOADER & TOAST ── */
.loader-ov{position:fixed;inset:0;background:rgba(240,247,230,.85);z-index:9999;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.loader-ov.show{display:flex}
.loader-spin{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--p);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 18px;border-radius:10px;font-family:var(--fn);font-size:.85rem;font-weight:600;color:#fff;transform:translateX(120%);transition:transform .3s;max-width:320px;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.toast.show{transform:translateX(0)}
.toast-s{background:#22c55e}
.toast-e{background:#ef4444}
.toast-i{background:#3b82f6}

/* ── UTILS ── */
.flex{display:flex}.items-center{align-items:center}.gap-2{gap:8px}.gap-3{gap:12px}
.justify-between{justify-content:space-between}.flex-1{flex:1}.mt-2{margin-top:8px}
.mt-3{margin-top:12px}.mb-2{margin-bottom:8px}.p-4{padding:16px}
.text-muted{color:var(--muted)}.text-sm{font-size:.82rem}.font-bold{font-weight:700}
.empty-state{text-align:center;padding:48px 20px;color:var(--muted)}
.empty-state-icon{font-size:2.5rem;margin-bottom:12px}
.empty-state p{font-size:.9rem}

@media(max-width:768px){
  .kpi-grid{grid-template-columns:1fr 1fr}
  .kb-col{min-width:200px;max-width:200px}
  .form-row,.form-row-3{grid-template-columns:1fr}
  .fotos-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<!-- ═══ LOGIN ═══ -->
<div id="v-login">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-text">SOMBREAR</div>
      <div class="login-logo-sub">Coberturas e Sombreamentos — CRM</div>
    </div>
    <div class="field"><label>E-mail</label><input id="l-email" type="email" placeholder="seu@email.com"></div>
    <div class="field"><label>Senha</label><input id="l-senha" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="btn-prim" id="btn-login" onclick="doLogin()">Entrar no CRM</button>
    <div class="err-msg" id="login-err">E-mail ou senha incorretos</div>
    <div class="ldr-msg" id="login-ldr">Verificando...</div>
  </div>
</div>

<!-- ═══ APP ═══ -->
<div id="app">
  <div class="app-wrap">

    <!-- SIDEBAR -->
    <nav id="sidebar">
      <div class="sb-logo">
        <svg viewBox="0 0 24 24"><path d="M12 3L2 9l10 6 10-6-10-6zM2 15l10 6 10-6M2 12l10 6 10-6"/></svg>
      </div>
      <button class="sb-btn active" id="sb-kanban" onclick="navigate('kanban')" title="Kanban">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="6" height="18" rx="1"/><rect x="12" y="3" width="6" height="12" rx="1"/><rect x="3" y="3" width="6" height="18" rx="1" style="display:none"/></svg>
      </button>
      <button class="sb-btn" id="sb-agenda" onclick="navigate('agenda')" title="Agenda">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      </button>
      <button class="sb-btn" id="sb-dashboard" onclick="navigate('dashboard')" title="Dashboard">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="22,12 18,12 15,21 9,3 6,12 2,12"/></svg>
      </button>
      <button class="sb-btn" id="sb-proposta" onclick="navigate('proposta')" title="Proposta">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      </button>
      <div class="sb-sep"></div>
      <button class="sb-btn" id="sb-usuarios" style="display:none" onclick="navigate('usuarios')" title="Usuários">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </button>
      <button class="sb-btn" id="sb-admin" style="display:none" onclick="navigate('admin')" title="Admin">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 1.93 14.14M4.93 4.93a10 10 0 0 0 0 14.14M12 2v2M12 20v2M2 12h2M20 12h2"/></svg>
      </button>
      <div class="sb-spacer"></div>

<script>
// ─── CONFIGURAÇÃO SUPABASE ───
const SB_URL='https://gwcgcvgowoqyhthdbear.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd3Y2djdmdvd29xeWh0aGRiZWFyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyMjQ1NzUsImV4cCI6MjA5MTgwMDU3NX0.lBB4o9J6DPr5MNQUP9p2lCWzhUBBS7Hvu0JETmH7hjc';

// ─── UTILS ───
function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''}
function fmt(n){return n?Number(n).toLocaleString('pt-BR',{minimumFractionDigits:2}):'0,00'}
function showL(){document.getElementById('loader').classList.add('show')}
function hideL(){document.getElementById('loader').classList.remove('show')}
function toast(msg,type='i'){
  var t=document.createElement('div');
  t.className='toast toast-'+type;t.textContent=msg;
  document.getElementById('toast-wrap').appendChild(t);
  setTimeout(function(){t.classList.add('show')},10);
  setTimeout(function(){t.classList.remove('show');setTimeout(function(){t.remove()},300)},3500);
}
function closeMdl(id){document.getElementById(id).classList.remove('open')}
function openMdl(id){document.getElementById(id).classList.add('open')}
function mascararCNPJ(el){
  var v=el.value.replace(/\D/g,'').slice(0,14);
  if(v.length>12)v=v.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{0,2}).*/,'$1.$2.$3/$4-$5');
  else if(v.length>8)v=v.replace(/^(\d{2})(\d{3})(\d{3})(\d{0,4}).*/,'$1.$2.$3/$4');
  else if(v.length>5)v=v.replace(/^(\d{2})(\d{3})(\d{0,3}).*/,'$1.$2.$3');
  else if(v.length>2)v=v.replace(/^(\d{2})(\d{0,3}).*/,'$1.$2');
  el.value=v;
}
function dataFmt(d){if(!d)return '—';var p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function tipoLabel(v){var m={cobertura_sombrite:'Sombrite',cobertura_telha:'Telha Sanduíche',cobertura_galvalume:'Galvalume',cobertura_misto:'Misto',cobertura_predio:'Prédio',outro:'Outro'};return m[v]||v||'—'}

// ─── AUTH ───
async function doLogin(){
  var email=document.getElementById('l-email').value.trim();
  var senha=document.getElementById('l-senha').value;
  var err=document.getElementById('login-err');var ldr=document.getElementById('login-ldr');
  if(!email||!senha){err.textContent='Preencha e-mail e senha';err.style.display='block';return}
  err.style.display='none';ldr.style.display='block';
  document.getElementById('btn-login').disabled=true;
  try{
    var res=await sb.auth.signInWithPassword({email,password:senha});
    if(res.error)throw res.error;
    await initApp();
  }catch(e){
    err.textContent='E-mail ou senha incorretos';err.style.display='block';
  }finally{ldr.style.display='none';document.getElementById('btn-login').disabled=false}
}

async function doLogout(){
  await sb.auth.signOut();
  document.getElementById('app').style.display='none';
  document.getElementById('v-login').style.display='flex';
}

// ─── NAVIGATION ───
function navigate(view){
  document.querySelectorAll('#main-content .view').forEach(function(v){v.classList.remove('active')});
  document.querySelectorAll('.sb-btn').forEach(function(b){b.classList.remove('active')});
  var vEl=document.getElementById('v-'+view);
  if(vEl)vEl.classList.add('active');
  var bEl=document.getElementById('sb-'+view);
  if(bEl)bEl.classList.add('active');
  if(view==='kanban')renderKanban();
  else if(view==='agenda')renderAgenda();
  else if(view==='dashboard')renderDashboard();
  else if(view==='usuarios')renderUsuarios();
  else if(view==='admin')renderAdmin();
  else if(view==='proposta')renderProposta();
}

function switchTab(name){
  document.querySelectorAll('#modal-lead .tab-btn').forEach(function(b,i){
    var tabs=['dados','visitas','fotos','historico'];
    b.classList.toggle('active',tabs[i]===name);
  });
  document.querySelectorAll('#modal-lead .tab-pane').forEach(function(p){p.classList.remove('active')});
  var el=document.getElementById('tab-'+name);
  if(el)el.classList.add('active');
  if(name==='visitas')renderLeadVisitas();
  else if(name==='fotos')renderLeadFotos();
  else if(name==='historico')renderLeadHistorico();
}

// ─── INIT ───
async function initApp(){
  showL();
  try{
    var sess=await sb.auth.getSession();
    if(!sess.data.session){hideL();return}
    App.user=sess.data.session.user;
    await loadPerfil();
    await loadAll();
    document.getElementById('v-login').style.display='none';
    document.getElementById('app').style.display='block';
    navigate('kanban');
    renderPropLeadSelect();
  }catch(e){
    toast('Erro ao iniciar: '+e.message,'e');
    console.error(e);
  }finally{hideL()}
}

async function loadPerfil(){
  var r=await sb.from('crm_profiles').select('*').eq('id',App.user.id).single();
  if(r.data){
    App.perfil=r.data;
    document.getElementById('user-nome-chip').textContent=r.data.nome||App.user.email;
    if(r.data.perfil==='gestor'){
      document.getElementById('sb-admin').style.display='flex';
      document.getElementById('sb-usuarios').style.display='flex';
    }
  }
}

async function loadAll(){
  var today=new Date().toISOString().slice(0,10);
  var [c,l,p,cfg,vis]=await Promise.all([
    sb.from('crm_colunas').select('*').order('ordem'),
    sb.from('crm_leads').select('*').order('created_at',{ascending:false}),
    sb.from('crm_profiles').select('id,nome,perfil,ativo'),
    sb.from('crm_config').select('*'),
    sb.from('crm_visitas').select('*').gte('data_visita',today).order('data_visita').order('horario'),
  ]);
  App.colunas=c.data||[];
  App.leads=l.data||[];
  App.profiles=p.data||[];
  App.visitas=vis.data||[];
  if(cfg.data)cfg.data.forEach(function(row){
    if(row.key==='horarios_visita')App.cfg.horarios=row.value||[];
    if(row.key==='tecnicos_visita')App.cfg.tecnicos=row.value||[];
    App.config[row.key]=row.value;
  });
  if(!App.cfg.horarios.length)App.cfg.horarios=['08:00','09:30','11:00','14:00','15:30','17:00'];
  if(!App.cfg.tecnicos.length)App.cfg.tecnicos=['Henrique','Cadu'];
}

// ─── KANBAN ───
function filteredLeads(){
  var q=(document.getElementById('kb-search')||{}).value||'';
  q=q.trim().toLowerCase();
  var isVend=App.perfil&&App.perfil.perfil==='vendedor';
  return App.leads.filter(function(l){
    if(isVend&&l.criado_por_id!==App.user.id)return false;
    if(q&&!((l.nome_condominio||'').toLowerCase().includes(q))&&!((l.sindico_nome||'').toLowerCase().includes(q)))return false;
    return true;
  });
}

function urgenciaBadge(lead){
  if(['fechado','perdido'].includes(lead.coluna))return '';
  var dias=Math.floor((Date.now()-new Date(lead.data_entrada_coluna))/86400000);
  var cor=dias<3?'#22c55e':dias<7?'#f59e0b':'#ef4444';
  var label=dias===0?'hoje':dias+'d';
  return '<span class="urg-badge" style="background:'+cor+'" title="'+dias+' dia(s) nesta etapa">'+label+'</span>';
}

function corCardPerdido(lead){
  if(lead.coluna!=='perdido')return '';
  if(lead.motivo_perda==='nao_aprovado')return 'border-left:4px solid #d97706;background:#fffbeb;';
  if(lead.motivo_perda==='concorrente')return 'border-left:4px solid #b91c1c;background:#fef2f2;';
  return '';
}

function badgePerdido(lead){
  if(lead.coluna!=='perdido')return '';
  if(lead.motivo_perda==='nao_aprovado')return '<span style="font-size:10px;background:#fef3c7;color:#92400e;padding:2px 7px;border-radius:20px;font-weight:700">Retomar</span>';
  if(lead.motivo_perda==='concorrente')return '<span style="font-size:10px;background:#fee2e2;color:#b91c1c;padding:2px 7px;border-radius:20px;font-weight:700">Concorrente</span>';
  return '';
}

function cardHTML(lead){
  var resp=App.profiles.find(function(p){return p.id===lead.responsavel_id});
  var cardStyle=corCardPerdido(lead);
  return '<div class="lead-card" style="'+cardStyle+'" draggable="true" data-id="'+lead.id+'" onclick="openLead(\''+lead.id+'\')">'
    +'<div class="card-top"><span class="card-nome">'+esc(lead.nome_condominio)+'</span>'+urgenciaBadge(lead)+badgePerdido(lead)+'</div>'
    +(lead.valor_estimado?'<div class="card-valor">R$ '+fmt(lead.valor_estimado)+'</div>':'')
    +'<div class="card-foot">'
    +'<span class="card-tipo">'+tipoLabel(lead.tipo_servico)+'</span>'
    +(resp?'<span class="card-resp" title="'+esc(resp.nome)+'">'+esc(resp.nome.split(' ')[0])+'</span>':'')
    +'</div></div>';
}

function renderKanban(){
  var board=document.getElementById('kb-board');
  if(!board)return;
  var leads=filteredLeads();
  var html=App.colunas.map(function(col){
    var colLeads=leads.filter(function(l){return l.coluna===col.id});
    var cards=colLeads.map(function(l){return cardHTML(l)}).join('');
    return '<div class="kb-col" data-col="'+col.id+'">'
      +'<div class="kb-col-head" style="color:'+col.cor+';border-bottom:2px solid '+col.cor+'"><span>'+esc(col.label)+'</span><span class="kb-col-badge">'+colLeads.length+'</span></div>'
      +'<div class="kb-col-body" id="col-body-'+col.id+'" ondragover="event.preventDefault();this.classList.add(\'drag-over\')" ondragleave="this.classList.remove(\'drag-over\')" ondrop="dropLead(event,\''+col.id+'\')">'+cards+'</div>'
      +'<button class="kb-col-add" onclick="openNovoLeadCol(\''+col.id+'\')">+</button>'
      +'</div>';
  }).join('');
  board.innerHTML=html;
  // Drag events
  board.querySelectorAll('.lead-card').forEach(function(card){
    card.addEventListener('dragstart',function(e){
      e.dataTransfer.setData('leadId',card.dataset.id);
      card.classList.add('dragging');
    });
    card.addEventListener('dragend',function(){card.classList.remove('dragging')});
  });
}

async function dropLead(e,colId){
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  var leadId=e.dataTransfer.getData('leadId');
  await moverLead(leadId,colId);
}

function modalMotivoPerdido(){
  return new Promise(function(resolve){
    var ov=document.createElement('div');
    ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px';
    ov.innerHTML='<div style="background:#fff;border-radius:16px;padding:28px;width:100%;max-width:340px;font-family:var(--fn)">'
      +'<h3 style="font-size:1rem;font-weight:700;margin-bottom:6px">Motivo da perda</h3>'
      +'<p style="font-size:.82rem;color:#64748b;margin-bottom:20px">Como deseja classificar este lead?</p>'
      +'<button id="btn-conc" style="width:100%;margin-bottom:10px;padding:12px;background:#fef2f2;border:1.5px solid #fca5a5;border-radius:10px;cursor:pointer;font-family:var(--fn);font-weight:600;color:#b91c1c;font-size:.88rem">🔴 Perdeu para concorrente</button>'
      +'<button id="btn-naoaprov" style="width:100%;margin-bottom:10px;padding:12px;background:#fffbeb;border:1.5px solid #fcd34d;border-radius:10px;cursor:pointer;font-family:var(--fn);font-weight:600;color:#92400e;font-size:.88rem">🟡 Não aprovado — contato futuro</button>'
      +'<button id="btn-cancel-m" style="width:100%;padding:10px;background:transparent;border:none;cursor:pointer;color:#94a3b8;font-family:var(--fn);font-size:.82rem">Cancelar</button>'
      +'</div>';
    document.body.appendChild(ov);
    ov.querySelector('#btn-conc').onclick=function(){document.body.removeChild(ov);resolve('concorrente')};
    ov.querySelector('#btn-naoaprov').onclick=function(){document.body.removeChild(ov);resolve('nao_aprovado')};
    ov.querySelector('#btn-cancel-m').onclick=function(){document.body.removeChild(ov);resolve(null)};
  });
}

async function moverLead(leadId,novaColuna){
  var lead=App.leads.find(function(l){return l.id===leadId});
  if(!lead||lead.coluna===novaColuna)return;
  var colunaAnt=lead.coluna;
  var motivo=null;
  if(novaColuna==='perdido'){
    motivo=await modalMotivoPerdido();
    if(motivo===null)return;
  }
  showL();
  try{
    var upd={coluna:novaColuna,data_entrada_coluna:new Date().toISOString()};
    if(motivo)upd.motivo_perda=motivo;
    var {error}=await sb.from('crm_leads').update(upd).eq('id',leadId);
    if(error)throw error;
    lead.coluna=novaColuna;
    lead.data_entrada_coluna=upd.data_entrada_coluna;
    if(motivo)lead.motivo_perda=motivo;
    await sb.from('crm_atividades').insert({lead_id:leadId,autor_id:App.user.id,tipo:'mover',coluna_de:colunaAnt,coluna_para:novaColuna,descricao:'Movido para '+novaColuna+(motivo?' — '+motivo:'')});
    renderKanban();
  }catch(e){toast('Erro: '+e.message,'e')}
  finally{hideL()}
}

async function salvarNovoLead(){
  var nome=document.getElementById('nl-nome').value.trim();
  var cnpj=document.getElementById('nl-cnpj').value.trim();
  var tipo=document.getElementById('nl-tipo').value;
  if(!nome){toast('Informe o nome do condomínio','e');return}
  // Checar duplicata por nome
  var nomeLower=nome.toLowerCase();
  var cnpjLimpo=cnpj.replace(/\D/g,'');
  var dupNome=App.leads.find(function(l){return l.nome_condominio&&l.nome_condominio.toLowerCase()===nomeLower});
  var dupCnpj=cnpjLimpo.length>=14?App.leads.find(function(l){return l.cnpj&&l.cnpj.replace(/\D/g,'')===cnpjLimpo}):null;
  var dup=dupNome||dupCnpj;
  if(dup){
    var criador=App.profiles.find(function(p){return p.id===dup.criado_por_id});
    var quem=criador?criador.nome:'outro usuário';
    toast('Já cadastrado ('+(dupCnpj?'CNPJ: '+cnpj:'nome: '+dup.nome_condominio)+') por '+quem,'e');return;
  }
  var primeiraColuna=_novoLeadColuna||(App.colunas[0]&&App.colunas[0].id)||'prospeccao';
  showL();
  try{
    var payload={
      nome_condominio:nome,cnpj:cnpj||null,criado_por_id:App.user.id,
      endereco:document.getElementById('nl-end').value||null,
      sindico_nome:document.getElementById('nl-sindico').value||null,
      sindico_tel:document.getElementById('nl-tel').value||null,
      unidades:parseInt(document.getElementById('nl-unidades').value)||null,
      valor_estimado:parseFloat(document.getElementById('nl-valor').value)||null,
      tipo_servico:tipo||null,
      coluna:primeiraColuna,
      data_entrada_coluna:new Date().toISOString(),
    };
    var {data,error}=await sb.from('crm_leads').insert(payload).select().single();
    if(error)throw error;
    App.leads.unshift(data);
    await sb.from('crm_atividades').insert({lead_id:data.id,autor_id:App.user.id,tipo:'criar',descricao:'Lead criado'});
    closeMdl('modal-novo-lead');
    renderKanban();
    toast('Lead criado!','s');
  }catch(e){toast('Erro: '+e.message,'e')}
  finally{hideL()}
}

async function salvarLead(){
  var lead=App.leads.find(function(l){return l.id===App.modalLeadId});
  if(!lead)return;
  var nome=document.getElementById('ld-nome').value.trim();
  if(!nome){toast('Nome é obrigatório','e');return}
  var novaColuna=document.getElementById('ld-coluna').value;
  var mudouColuna=novaColuna&&novaColuna!==lead.coluna;
  var upd={
    nome_condominio:nome,
    cnpj:document.getElementById('ld-cnpj').value||null,
    endereco:document.getElementById('ld-end').value||null,
    sindico_nome:document.getElementById('ld-sindico').value||null,
    sindico_tel:document.getElementById('ld-tel').value||null,
    sindico_email:document.getElementById('ld-email').value||null,
    unidades:parseInt(document.getElementById('ld-unidades').value)||null,
    tipo_servico:document.getElementById('ld-tipo').value||null,
    valor_estimado:parseFloat(document.getElementById('ld-valor').value)||null,
    responsavel_id:document.getElementById('ld-resp').value||null,
    observacoes:document.getElementById('ld-obs').value||null,
  };
  if(mudouColuna){
    if(novaColuna==='perdido'){
      var motivo=await modalMotivoPerdido();
      if(motivo===null)return;
      upd.motivo_perda=motivo;
    }
    upd.coluna=novaColuna;
    upd.data_entrada_coluna=new Date().toISOString();
  }
  showL();
  try{
    var {error}=await sb.from('crm_leads').update(upd).eq('id',lead.id);
    if(error)throw error;
    Object.assign(lead,upd);
    await sb.from('crm_atividades').insert({lead_id:lead.id,autor_id:App.user.id,tipo:'editar',descricao:'Lead editado'});
    closeMdl('modal-lead');
    renderKanban();
    toast('Lead atualizado!','s');
  }catch(e){toast('Erro: '+e.message,'e')}
  finally{hideL()}
}

async function excluirLead(){

function gerarLinkGCal(visita,lead){
  var data=(visita.data_visita||'').replace(/-/g,'');
  var hora=(visita.horario||'08:00').split(':');
  var hh=hora[0]||'08',mm=hora[1]||'00';
  var ini=data+'T'+hh+mm+'00';
  var fimHH=String(parseInt(hh)+1).padStart(2,'0');
  var fim=data+'T'+fimHH+mm+'00';
  var titulo=encodeURIComponent('Visita Sombrear — '+((lead&&lead.nome_condominio)||''));
  var det=encodeURIComponent('Técnico: '+(visita.tecnico||'—')+'\nVendedor: '+(visita.vendedor_nome||'—'));
  var loc=encodeURIComponent((lead&&lead.endereco)||'');
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+titulo+'&dates='+ini+'/'+fim+'&details='+det+'&location='+loc;
}

// ─── AGENDA ───
function renderAgenda(){
  var year=App.calYear,month=App.calMonth;
  var meses=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  document.getElementById('cal-title').textContent=meses[month]+' '+year;
  var grid=document.getElementById('cal-grid');
  if(!grid)return;
  var dias=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  var html=dias.map(function(d){return '<div class="cal-dow">'+d+'</div>'}).join('');
  var firstDay=new Date(year,month,1).getDay();
  var totalDias=new Date(year,month+1,0).getDate();
  var today=new Date().toISOString().slice(0,10);
  for(var i=0;i<firstDay;i++)html+='<div class="cal-day other-month"></div>';
  for(var d=1;d<=totalDias;d++){
    var dateStr=year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var dayVis=App.visitas.filter(function(v){return v.data_visita===dateStr});
    var isToday=dateStr===today;
    html+='<div class="cal-day'+(isToday?' today':'')+'"><div class="cal-day-num">'+d+'</div>'
      +dayVis.map(function(v){
        var lead=App.leads.find(function(l){return l.id===v.lead_id});
        return '<div class="cal-event'+' '+(v.tipo==='assembleia'?'assembleia':'')+(v.status==='cancelado'?' cancelado':'')+(v.status==='realizado'?' realizado':'')+'" title="'+esc((lead&&lead.nome_condominio)||'')+' '+(v.horario||'')+'" onclick="event.stopPropagation();openLeadFromVisita(\''+v.lead_id+'\')">'+esc((lead&&lead.nome_condominio)||'')+'</div>';
      }).join('')
      +'</div>';
  }
  grid.innerHTML=html;
  // Próximas visitas
  var prox=document.getElementById('proximas-visitas');
  if(!prox)return;
  var futuras=App.visitas.filter(function(v){return v.status==='agendado'&&v.data_visita>=today}).slice(0,8);
  if(!futuras.length){prox.innerHTML='<div class="empty-state" style="padding:20px"><p>Nenhuma visita agendada</p></div>';return}
  prox.innerHTML=futuras.map(function(v){
    var lead=App.leads.find(function(l){return l.id===v.lead_id});
    var gcal=gerarLinkGCal(v,lead);
    return '<div class="vis-card" style="cursor:pointer" onclick="openLeadFromVisita(\''+v.lead_id+'\')">'
      +'<div class="vis-card-head"><span class="vis-card-date">'+dataFmt(v.data_visita)+' '+(v.horario||'')+'</span><span class="badge badge-blue">'+(v.tipo==='assembleia'?'Assembleia':'Visita')+'</span></div>'
      +'<div style="font-size:.85rem;font-weight:700;color:var(--txt)">'+esc((lead&&lead.nome_condominio)||'—')+'</div>'
      +'<div class="vis-card-meta"><span>🔧 '+(v.tecnico||'—')+'</span><span>👤 '+(v.vendedor_nome||'—')+'</span></div>'
      +'<a href="'+gcal+'" target="_blank" class="btn-gcal" onclick="event.stopPropagation()">📅 Google Calendar</a>'
      +'</div>';
  }).join('');
}

function openLeadFromVisita(leadId){closeMdl('modal-visita');openLead(leadId)}
function calPrev(){App.calMonth--;if(App.calMonth<0){App.calMonth=11;App.calYear--}renderAgenda()}
function calNext(){App.calMonth++;if(App.calMonth>11){App.calMonth=0;App.calYear++}renderAgenda()}

// ─── DASHBOARD ───
async function renderDashboard(){
  var el=document.getElementById('dashboard-content');
  if(!el)return;
  showL();
  try{
    var mesAtual=new Date().toISOString().slice(0,7);
    var metasRes=await sb.from('crm_metas').select('*').eq('mes',mesAtual).catch(function(){return {data:[]}});
    var metas=metasRes.data||[];
    var leads=App.leads;
    var ativos=leads.filter(function(l){return!['perdido','fechado'].includes(l.coluna)}).length;
    var pipeline=leads.reduce(function(s,l){return s+(l.valor_estimado||0)},0);
    var fechados=leads.filter(function(l){return l.coluna==='fechado'}).length;
    var taxa=leads.length?Math.round(fechados/leads.length*100):0;
    var novos7=leads.filter(function(l){return new Date(l.created_at)>new Date(Date.now()-7*864e5)}).length;
    var perdidos=leads.filter(function(l){return l.coluna==='perdido'}).length;
    var html='<div class="kpi-grid">'
      +'<div class="kpi-card"><div class="kpi-label">Leads Ativos</div><div class="kpi-val">'+ativos+'</div><div class="kpi-sub">em andamento</div></div>'
      +'<div class="kpi-card"><div class="kpi-label">Pipeline</div><div class="kpi-val" style="font-size:1.2rem">R$ '+fmt(pipeline)+'</div><div class="kpi-sub">valor estimado total</div></div>'
      +'<div class="kpi-card"><div class="kpi-label">Taxa de Fechamento</div><div class="kpi-val">'+taxa+'%</div><div class="kpi-sub">'+fechados+' fechados / '+leads.length+' total</div></div>'
      +'<div class="kpi-card"><div class="kpi-label">Novos (7 dias)</div><div class="kpi-val">'+novos7+'</div><div class="kpi-sub">'+perdidos+' perdidos total</div></div>'
      +'</div>';
    // Kanban por coluna
    html+='<div class="section-card"><div class="section-title">Distribuição por Etapa</div><div style="display:flex;gap:8px;flex-wrap:wrap">'
      +App.colunas.map(function(col){
        var n=leads.filter(function(l){return l.coluna===col.id}).length;
        return '<div style="flex:1;min-width:100px;background:var(--bg);border-radius:10px;padding:14px;text-align:center;border:1.5px solid '+col.cor+'">'
          +'<div style="font-size:1.4rem;font-weight:700;color:'+col.cor+'">'+n+'</div>'
          +'<div style="font-size:.72rem;color:var(--muted);font-weight:700;text-transform:uppercase">'+esc(col.label)+'</div>'
          +'</div>';
      }).join('')+'</div></div>';
    // Metas por vendedor
    var vendedores=App.profiles.filter(function(p){return p.perfil==='vendedor'&&p.ativo!==false});
    if(vendedores.length){
      html+='<div class="section-card"><div class="section-title">Metas do Mês — '+meses[new Date().getMonth()]+'/'+new Date().getFullYear()+'</div>'
        +'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px">'
        +vendedores.map(function(v){
          var meta=metas.find(function(m){return m.vendedor_id===v.id});
          var metaVal=meta?parseFloat(meta.meta_valor):0;
          var realizado=leads.filter(function(l){return l.coluna==='fechado'&&l.responsavel_id===v.id&&(l.updated_at||'').startsWith(mesAtual)}).reduce(function(s,l){return s+(l.valor_estimado||0)},0);
          var pct=metaVal>0?Math.min(100,Math.round(realizado/metaVal*100)):0;
          var cor=pct>=100?'#22c55e':pct>=70?'#f59e0b':'#ef4444';
          return '<div style="background:#fff;border-radius:12px;padding:16px;border:1px solid var(--border)">'
            +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'
            +'<strong style="font-size:.88rem">'+esc(v.nome.split(' ')[0])+'</strong>'
            +(App.perfil&&App.perfil.perfil==='gestor'?'<input type="number" placeholder="Meta R$" value="'+(metaVal||'')+'" style="width:100px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:.75rem;font-family:var(--fn)" onchange="salvarMeta(\''+v.id+'\',this.value)">':'<span style="font-size:.75rem;color:var(--muted)">R$ '+fmt(metaVal)+'</span>')
            +'</div>'
            +'<div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:'+pct+'%;background:'+cor+'"></div></div>'
            +'<div style="display:flex;justify-content:space-between;font-size:.75rem"><span style="color:'+cor+';font-weight:700">R$ '+fmt(realizado)+'</span><span style="color:var(--muted)">'+pct+'%</span></div>'
            +'</div>';
        }).join('')
        +'</div></div>';
    }
    // Tempo por etapa
    html+='<div class="section-card"><div class="section-title">Tempo Médio por Etapa (leads ativos)</div>'
      +'<table class="tbl"><thead><tr><th>Etapa</th><th style="text-align:center">Leads</th><th style="text-align:center">Média</th><th style="text-align:center">Máximo</th></tr></thead><tbody>'
      +App.colunas.filter(function(c){return!['fechado','perdido'].includes(c.id)}).map(function(col){
        var arr=leads.filter(function(l){return l.coluna===col.id&&l.data_entrada_coluna}).map(function(l){return Math.floor((Date.now()-new Date(l.data_entrada_coluna))/86400000)});
        var media=arr.length?Math.round(arr.reduce(function(a,b){return a+b},0)/arr.length):0;
        var max=arr.length?Math.max.apply(null,arr):0;
        return '<tr><td><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:'+col.cor+';margin-right:6px"></span>'+esc(col.label)+'</td>'
          +'<td style="text-align:center">'+arr.length+'</td>'
          +'<td style="text-align:center">'+media+'d</td>'
          +'<td style="text-align:center;color:'+(max>7?'#ef4444':'inherit')+'">'+max+'d</td></tr>';
      }).join('')
      +'</tbody></table></div>';
    el.innerHTML=html;
  }catch(e){el.innerHTML='<div class="empty-state"><p>Erro ao carregar dashboard: '+esc(e.message)+'</p></div>'}
  finally{hideL()}
}

var meses=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

async function salvarMeta(vendedorId,valor){
  var mes=new Date().toISOString().slice(0,7);
  await sb.from('crm_metas').upsert({vendedor_id:vendedorId,mes:mes,meta_valor:parseFloat(valor)||0},{onConflict:'vendedor_id,mes'}).catch(function(){});
  toast('Meta salva!','s');
}

function openNovoUsuario(){
  App.editUsuarioId=null;
  document.getElementById('modal-usuario-title').textContent='Novo Usuário';
  ['u-nome','u-email','u-senha'].forEach(function(id){document.getElementById(id).value=''});
  document.getElementById('u-perfil').value='vendedor';
  document.getElementById('u-senha-wrap').style.display='block';
  openMdl('modal-usuario');
}

function editarUsuario(id){
  App.editUsuarioId=id;
  document.getElementById('modal-usuario-title').textContent='Editar Usuário';
  sb.from('crm_profiles').select('*').eq('id',id).single().then(function(r){
    if(r.data){
      document.getElementById('u-nome').value=r.data.nome||'';
      document.getElementById('u-email').value=r.data.email||'';
      document.getElementById('u-perfil').value=r.data.perfil||'vendedor';
    }
  });
  document.getElementById('u-senha-wrap').style.display='none';
  openMdl('modal-usuario');
}

async function salvarUsuario(){
  var nome=document.getElementById('u-nome').value.trim();
  var email=document.getElementById('u-email').value.trim();
  var perfil=document.getElementById('u-perfil').value;
  if(!nome||!email){toast('Preencha nome e e-mail','e');return}
  showL();
  try{
    if(App.editUsuarioId){
      var {error}=await sb.from('crm_profiles').update({nome,email,perfil}).eq('id',App.editUsuarioId);
      if(error)throw error;
      toast('Usuário atualizado!','s');
    } else {
      var senha=document.getElementById('u-senha').value;
      if(!senha||senha.length<6){toast('Senha: mínimo 6 caracteres','e');hideL();return}
      var sbReg=supabase.createClient(SB_URL,SB_KEY);
      var {data:d,error:e}=await sbReg.auth.signUp({email,password:senha,options:{data:{nome}}});
      if(e)throw e;
      await sbReg.auth.signOut();
      await sb.from('crm_profiles').upsert({id:d.user.id,nome,email,perfil,ativo:true});
      toast('Usuário criado! Confirme o e-mail se necessário.','s');
    }
    closeMdl('modal-usuario');
    renderUsuarios();
  }catch(e){toast('Erro: '+e.message,'e')}
  finally{hideL()}
}

async function toggleAtivoUsuario(id,ativo){
  showL();
  try{
    var {error}=await sb.from('crm_profiles').update({ativo:ativo==='true'||ativo===true}).eq('id',id);
    if(error)throw error;
    toast('Usuário '+(ativo==='true'||ativo===true?'ativado':'desativado'),'s');
    renderUsuarios();
  }catch(e){toast('Erro: '+e.message,'e')}
  finally{hideL()}
}

async function salvarColuna(id){
  var lbl=document.getElementById('col-lbl-'+id).value.trim();
  var cor=document.getElementById('col-cor-'+id).value;
  if(!lbl)return;
  showL();
  try{
    var {error}=await sb.from('crm_colunas').update({label:lbl,cor:cor}).eq('id',id);
    if(error)throw error;
    var col=App.colunas.find(function(c){return c.id===id});
    if(col){col.label=lbl;col.cor=cor}
    toast('Coluna atualizada!','s');
    renderKanban();
  }catch(e){toast('Erro: '+e.message,'e')}
  finally{hideL()}
}

async function salvarConfig(){
  var horarios=(document.getElementById('cfg-horarios').value||'').split(',').map(function(h){return h.trim()}).filter(Boolean);
  var tecnicos=(document.getElementById('cfg-tecnicos').value||'').split(',').map(function(t){return t.trim()}).filter(Boolean);
  showL();
  try{
    await sb.from('crm_config').upsert([{key:'horarios_visita',value:horarios},{key:'tecnicos_visita',value:tecnicos}]);
    App.cfg.horarios=horarios;App.cfg.tecnicos=tecnicos;
    toast('Configurações salvas!','s');
  }catch(e){toast('Erro: '+e.message,'e')}
  finally{hideL()}
}

function buildPropostaHTML(lead){
  var num='PROP-'+new Date().getFullYear()+'-'+String(Math.floor(Math.random()*9999)).padStart(4,'0');
  var dataFmtBR=new Date().toLocaleDateString('pt-BR');
  var PRECO_BASE={cobertura_sombrite:180,cobertura_telha:350,cobertura_galvalume:220,cobertura_misto:260,cobertura_predio:180};
  var tipo=lead&&lead.tipo_servico?PRECO_BASE[lead.tipo_servico]||180:180;
  var unidades=lead&&lead.unidades?lead.unidades:0;
  var valorBase=lead&&lead.valor_estimado?lead.valor_estimado:(unidades*tipo)||0;
  return '<div class="prop-header">'
    +'<div><div class="prop-empresa-nome">SOMBREAR</div><div class="prop-empresa-sub">Coberturas e Sombreamentos</div></div>'
    +'<div class="prop-numero"><span style="color:var(--muted);font-size:.75rem">Proposta</span><strong>'+num+'</strong><span style="font-size:.72rem;color:var(--muted);display:block">'+dataFmtBR+'</span></div>'
    +'</div>'
    +'<div><strong>Para:</strong> '+(lead?esc(lead.nome_condominio):'<span contenteditable="true" style="border-bottom:1px dashed var(--border);min-width:200px;display:inline-block">Nome do Cliente</span>')+'</div>'
    +'<div style="margin-top:4px;font-size:.82rem;color:var(--muted)">'+(lead&&lead.endereco?esc(lead.endereco):'')+(lead&&lead.sindico_nome?' — Síndico: '+esc(lead.sindico_nome):'')+'</div>'
    +'<table class="prop-table" style="margin-top:20px">'
    +'<thead><tr><th>Descrição</th><th>Unidade</th><th style="text-align:right">Qtde</th><th style="text-align:right">V. Unit.</th><th style="text-align:right">Total</th></tr></thead>'
    +'<tbody>'
    +'<tr><td contenteditable="true">'+tipoLabel(lead&&lead.tipo_servico?lead.tipo_servico:'cobertura_sombrite')+' — '+(unidades||0)+' vagas</td><td>Serviço</td><td style="text-align:right">1</td><td style="text-align:right" contenteditable="true">R$ '+fmt(valorBase)+'</td><td style="text-align:right">R$ '+fmt(valorBase)+'</td></tr>'
    +'<tr style="opacity:.5;font-style:italic"><td contenteditable="true">Adicionar item...</td><td>—</td><td style="text-align:right" contenteditable="true">0</td><td style="text-align:right" contenteditable="true">R$ 0,00</td><td style="text-align:right">R$ 0,00</td></tr>'
    +'</tbody>'
    +'<tfoot><tr class="prop-total-row"><td colspan="4" style="text-align:right;padding:12px">TOTAL</td><td style="text-align:right;padding:12px;color:var(--p)">R$ '+fmt(valorBase)+'</td></tr></tfoot>'
    +'</table>'
    +'<div class="prop-obs"><strong>Observações:</strong> <span contenteditable="true">Proposta válida por 30 dias. Prazo de execução a confirmar após aprovação.</span></div>'
    +'<div class="prop-sign">'
    +'<div class="sign-box">Sombrear Coberturas e Sombreamentos<br><span style="font-size:.7rem">Responsável Comercial</span></div>'
    +'<div class="sign-box">'+(lead?esc(lead.nome_condominio):'Cliente')+'<br><span style="font-size:.7rem">Aprovação</span></div>'
    +'</div>';
}
